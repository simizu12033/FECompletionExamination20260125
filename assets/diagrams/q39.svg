<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" role="img" aria-labelledby="title39 desc39"><title id="title39">問39 アジャイル開発のスクラム</title><desc id="desc39">役割・イベント・作成物という組合せが、スクラムの手掛かり。</desc><g font-family="Meiryo,Yu Gothic,sans-serif"><rect x="0" y="0" width="960" height="760" rx="0" fill="#f8fbfe" stroke="none"/><text x="36.00" y="25" font-size="18" fill="#61768a" font-weight="400" dominant-baseline="text-before-edge">問39  /  システム開発</text><text x="36.00" y="62" font-size="30" fill="#16324f" font-weight="700" dominant-baseline="text-before-edge">アジャイル開発のスクラム</text><line x1="36" y1="118" x2="924" y2="118" stroke="#bfd0df" stroke-width="1"/><rect x="60" y="165" width="250" height="150" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="158.00" y="189.5" font-size="27" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">役割</text><text x="99.50" y="234.5" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">プロダクトオーナー</text><text x="166.00" y="262.5" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">など</text><rect x="355" y="165" width="250" height="150" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="426.00" y="189.5" font-size="27" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">イベント</text><text x="394.50" y="234.5" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">スプリントレビュー</text><text x="461.00" y="262.5" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">など</text><rect x="650" y="165" width="250" height="150" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="734.50" y="189.5" font-size="27" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">作成物</text><text x="680.00" y="234.5" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">プロダクトバックログ</text><text x="756.00" y="262.5" font-size="19" fill="#16324f" font-weight="400" dominant-