<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" role="img" aria-labelledby="title8 desc8"><title id="title8">問8 MIPSとトランザクション性能</title><desc id="desc8">使える命令数を求め、1件当たりの命令数で割って件数へ直す。</desc><g font-family="Meiryo,Yu Gothic,sans-serif"><rect x="0" y="0" width="960" height="760" rx="0" fill="#f8fbfe" stroke="none"/><text x="36.00" y="25" font-size="18" fill="#61768a" font-weight="400" dominant-baseline="text-before-edge">問08  /  ハードウェア</text><text x="36.00" y="62" font-size="30" fill="#16324f" font-weight="700" dominant-baseline="text-before-edge">MIPSとトランザクション性能</text><line x1="36" y1="118" x2="924" y2="118" stroke="#bfd0df" stroke-width="1"/><rect x="55" y="190" width="850" height="105" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="244.00" y="206.0" font-size="27" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">200 MIPS ＝ 毎秒200,000,000命令</text><text x="408.00" y="251.0" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">M（メガ）は10⁶</text><rect x="80" y="340" width="70" height="50" rx="4" fill="#087d64" stroke="none"/><rect x="160" y="340" width="70" height="50" rx="4" fill="#087d64" stroke="none"/><rect x="240" y="340" width="70" height="50" rx="4" fill="#087d64" stroke="none"/><rect x="320" y="340" width="70" height="50" rx="4" fill="#087d64" stroke="none"/><rect x="400" y="340" width="70" height="50" rx="4" fill="#087d64" stroke="none"/><rect x="480" y="340" width="70" height="50" rx="4" fill="#087d64" stroke="none"/><rect x="560" y="340" width="70" height="50" rx="4" fill="#087d64" stroke="none"/><rect x="640" y="340" width="70" height="50" rx="4" fill="#087d64" stroke="none"/><rect x="720" y="340" width="70" height="50" rx="4" fill="#dbe3e9" stroke="none"/><rect x="800" y="340" width="70" height="50" rx="4" fill="#dbe3e9" stroke="none"/><text x="257.00" y="407" font-size="25" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">利用率80％ → 160,000,000命令／秒</text><line x1="480" y1="450" x2="480" y2="490" stroke="#2872ae" stroke-width="3"/><polygon points="480.0,490.0 474.2,477.3 485.8,477.3" fill="#2872ae"/><rect x="378.5" y="462.0" width="203.0" height="27" rx="3" fill="#f8fbfe" stroke="none"/><text x="384.50" y="464.0" font-size="18" fill="#2872ae" font-weight="400" dominant-baseline="text-before-edge">1件800,000命令で割る</text><rect x="180" y="520" width="600" height="105" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="397.00" y="534.0" font-size="31" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">200 件／秒</text><text x="366.00" y="583.0" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">160,000,000 ÷ 800,000</text><rect x="36" y="675" width="888" height="62" rx="12" fill="#e4f5ed" stroke="none"/><text x="193.00" y="684" font-size="20" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">使える命令数を求め、1件当たりの命令数で割って件数へ直す。</text><text x="924" y="25" font-size="16" fill="#61768a" text-anchor="end" dominant-baseline="text-before-edge">問題に対応</text></g></svg>