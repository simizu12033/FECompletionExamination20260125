<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" role="img" aria-labelledby="title49 desc49"><title id="title49">問49 コアコンピタンス</title><desc id="desc49">コアコンピタンスは、複数の競争優位を支える自社独自の中核能力。</desc><g font-family="Meiryo,Yu Gothic,sans-serif"><rect x="0" y="0" width="960" height="760" rx="0" fill="#f8fbfe" stroke="none"/><text x="36.00" y="25" font-size="18" fill="#61768a" font-weight="400" dominant-baseline="text-before-edge">問49  /  経営戦略</text><text x="36.00" y="62" font-size="30" fill="#16324f" font-weight="700" dominant-baseline="text-before-edge">コアコンピタンス</text><line x1="36" y1="118" x2="924" y2="118" stroke="#bfd0df" stroke-width="1"/><circle cx="480" cy="345" r="130" fill="#e4f5ed" stroke="#087d64" stroke-width="3"/><text x="376.00" y="299" font-size="26" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">独自の技術・技能</text><text x="396.00" y="348" font-size="24" fill="#087d64" font-weight="400" dominant-baseline="text-before-edge">中核となる能力</text><rect x="60" y="175" width="250" height="90" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="119.00" y="204.5" font-size="23" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">商品Aの強み</text><line x1="353.3253816918608" y1="285.38841491381686" x2="310" y2="265" stroke="#2872ae" stroke-width="3"/><polygon points="310.0,265.0 324.0,265.1 319.0,275.7" fill="#2872ae"/><rect x="650" y="175" width="250" height="90" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="709.00" y="204.5" font-size="23" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">商品Bの強み</text><line x1="606.6746183081392" y1="285.38841491381686" x2="650" y2="265" stroke="#2872ae" stroke-width="3"/><polygon points="650.0,265.0 641.0,275.7 636.0,265.1" fill="#2872ae"/><rect x="60" y="500" width="250" height="90" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="96.50" y="529.5" font-size="23" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">サービスCの強み</text><line x1="376.5461818521339