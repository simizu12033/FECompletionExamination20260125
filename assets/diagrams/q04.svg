<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" role="img" aria-labelledby="title4 desc4"><title id="title4">問4 計算量と処理速度</title><desc id="desc4">先に仕事量を1,000倍し、その仕事を4倍速で処理する。</desc><g font-family="Meiryo,Yu Gothic,sans-serif"><rect x="0" y="0" width="960" height="760" rx="0" fill="#f8fbfe" stroke="none"/><text x="36.00" y="25" font-size="18" fill="#61768a" font-weight="400" dominant-baseline="text-before-edge">問04  /  アルゴリズム</text><text x="36.00" y="62" font-size="30" fill="#16324f" font-weight="700" dominant-baseline="text-before-edge">計算量と処理速度</text><line x1="36" y1="118" x2="924" y2="118" stroke="#bfd0df" stroke-width="1"/><rect x="45" y="210" width="230" height="150" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="116.00" y="251.0" font-size="22" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">元の条件</text><text x="107.50" y="291.0" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">100元・2秒</text><rect x="365" y="210" width="230" height="150" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="421.00" y="251.0" font-size="22" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">規模を10倍</text><text x="396.50" y="291.0" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">1,000元・2,000秒</text><rect x="685" y="210" width="230" height="150" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="748.50" y="251.0" font-size="22" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">速度を4倍</text><text x="726.00" y="291.0" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">1,000元・500秒</text><line x1="280" y1="285" x2="355" y2="285" stroke="#2872ae" stroke-width="3"/><polygon points="355.0,285.0 342.3,290.8 342.3,279.2" fill="#2872ae"/><rect x="289.5" y="252.0" width="56.0" height="27" rx="3" fill="#f8fbfe" stroke="none"/><text x="295.50" y="254.0" font-size="18" fill="#2872ae" font-weight="400" dominant-baseline="text-before-edge">×10³</text><line x1="600" y1="285" x2="675" y2="285" stroke="#2872ae" stroke-width="3"/><polygon points="675.0,285.0 662.3,290.8 662.3,279.2" fill="#2872ae"/><rect x="619.0" y="252.0" width="37.0" height="27" rx="3" fill="#f8fbfe" stroke="none"/><text x="625.00" y="254.0" font-size="18" fill="#2872ae" font-weight="400" dominant-baseline="text-before-edge">÷4</text><text x="310.00" y="435" font-size="26" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">規模：1,000 ÷ 100 ＝ 10倍</text><text x="249.50" y="495" font-size="31" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">時間：2秒 × 10³ ÷ 4 ＝ 500秒</text><text x="100.00" y="578" font-size="21" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">「問題の規模」は3乗で効く。「装置の速さ」は割り算で効く。</text><rect x="36" y="675" width="888" height="62" rx="12" fill="#e4f5ed" stroke="none"/><text x="221.50" y="684" font-size="20" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">先に仕事量を1,000倍し、その仕事を4倍速で処理する。</text><text x="924" y="25" font-size="16" fill="#61768a" text-anchor="end" dominant-baseline="text-before-edge">問題に対応</text></g></svg>