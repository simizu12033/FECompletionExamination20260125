<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" role="img" aria-labelledby="title44 desc44"><title id="title44">問44 雷サージへの対策</title><desc id="desc44">雷による過電圧の対策はSPD。停電対策や回線二重化とは目的が異なる。</desc><g font-family="Meiryo,Yu Gothic,sans-serif"><rect x="0" y="0" width="960" height="760" rx="0" fill="#f8fbfe" stroke="none"/><text x="36.00" y="25" font-size="18" fill="#61768a" font-weight="400" dominant-baseline="text-before-edge">問44  /  サービス管理</text><text x="36.00" y="62" font-size="30" fill="#16324f" font-weight="700" dominant-baseline="text-before-edge">雷サージへの対策</text><line x1="36" y1="118" x2="924" y2="118" stroke="#bfd0df" stroke-width="1"/><text x="85.00" y="195" font-size="28" fill="#b34b52" font-weight="700" dominant-baseline="text-before-edge">落雷など</text><text x="105.00" y="270" font-size="30" fill="#b34b52" font-weight="700" dominant-baseline="text-before-edge">過電圧</text><line x1="235" y1="290" x2="370" y2="290" stroke="#b34b52" stroke-width="3"/><polygon points="370.0,290.0 357.3,295.8 357.3,284.2" fill="#b34b52"/><rect x="269.5" y="257.0" width="66.0" height="27" rx="3" fill="#f8fbfe" stroke="none"/><text x="275.50" y="259.0" font-size="18" fill="#b34b52" font-weight="400" dominant-baseline="text-before-edge">通信線</text><rect x="385" y="210" width="230" height="155" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="467.00" y="249.0" font-size="31" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">SPD</text><text x="414.50" y="298.0" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">サージ防護デバイス</text><line x1="625" y1="290" x2="715" y2="290" stroke="#087d64" stroke-width="3"/><polygon points="715.0,290.0 702.3,295.8 702.3,284.2" fill="#087d64"/><rect x="637.0" y="257.0" width="66.0" height="27" rx="3" fill="#f8fbfe" stroke="none"/><text x="643.00" y="259.0" font-size="18" fill="#087d64" font-weight="400" dominant-baseline="text-before-edge">抑制後</text><rect x="730" y="210" width="175" height="155" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="790.50" y="251.0" font-size="27" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">機器</text><text x="760.50" y="296.0" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">コンピュータ</text><rect x="105" y="460" width="375.0" height="48" rx="0" fill="#16324f" stroke="#bfd0df"/><text x="242.50" y="470.5" font-size="20" fill="white" font-weight="700" dominant-baseline="text-before-edge">備える障害</text><rect x="480.0" y="460" width="375.0" height="48" rx="0" fill="#16324f" stroke="#bfd0df"/><text x="627.50" y="470.5" font-size="20" fill="white" font-weight="700" dominant-baseline="text-before-edge">対策の例</text><rect x="105" y="508" width="375.0" height="48" rx="0" fill="white" stroke="#bfd0df"/><text x="252.50" y="518.5" font-size="20" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">雷サージ</text><rect x="480.0" y="508" width="375.0" height="48" rx="0" fill="white" stroke="#bfd0df"/><text x="577.50" y="518.5" font-size="20" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">SPDで過電圧を抑制</text><rect x="105" y="556" width="375.0" height="48" rx="0" fill="white" stroke="#bfd0df"/><text x="272.50" y="566.5" font-size="20" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">停電</text><rect x="480.0" y="556" width="375.0" height="48" rx="0" fill="white" stroke="#bfd0df"/><text x="577.50" y="566.5" font-size="20" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">UPS・自家発電など</text><rect x="105" y="604" width="375.0" height="48" rx="0" fill="white" stroke="#bfd0df"/><text x="222.50" y="614.5" font-size="20" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">通信経路の故障</text><rect x="480.0" y="604" width="375.0" height="48" rx="0" fill="white" stroke="#bfd0df"/><text x="577.50" y="614.5" font-size="20" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">異なる経路の二重化</text><rect x="36" y="675" width="888" height="62" rx="12" fill="#e4f5ed" stroke="none"/><text x="148.50" y="684" font-size="20" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">雷による過電圧の対策はSPD。停電対策や回線二重化とは目的が異なる。</text></g></svg>