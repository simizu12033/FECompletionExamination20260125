<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" role="img" aria-labelledby="title7 desc7"><title id="title7">問7 XMLの特徴</title><desc id="desc7">タグは用途に合わせて定義できる。表示スタイルは別に指定できる。</desc><g font-family="Meiryo,Yu Gothic,sans-serif"><rect x="0" y="0" width="960" height="760" rx="0" fill="#f8fbfe" stroke="none"/><text x="36.00" y="25" font-size="18" fill="#61768a" font-weight="400" dominant-baseline="text-before-edge">問07  /  ソフトウェア</text><text x="36.00" y="62" font-size="30" fill="#16324f" font-weight="700" dominant-baseline="text-before-edge">XMLの特徴</text><line x1="36" y1="118" x2="924" y2="118" stroke="#bfd0df" stroke-width="1"/><rect x="45" y="170" width="440" height="360" rx="12" fill="#16324f" stroke="none"/><text x="65.00" y="220" font-size="23" fill="white" font-weight="400" dominant-baseline="text-before-edge">&lt;student&gt;</text><text x="65.00" y="283" font-size="23" fill="white" font-weight="400" dominant-baseline="text-before-edge">  &lt;name&gt;佐藤&lt;/name&gt;</text><text x="65.00" y="346" font-size="23" fill="white" font-weight="400" dominant-baseline="text-before-edge">  &lt;score&gt;80&lt;/score&gt;</text><text x="65.00" y="409" font-size="23" fill="white" font-weight="400" dominant-baseline="text-before-edge">&lt;/student&gt;</text><rect x="625" y="180" width="220" height="80" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="690.50" y="186.0" font-size="22" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">student</text><text x="649.50" y="226.0" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">生徒というまとまり</text><line x1="735" y1="260" x2="735" y2="320" stroke="#2872ae" stroke-width="2"/><line x1="605" y1="320" x2="855" y2="320" stroke="#2872ae" stroke-width="2"/><line x1="605" y1="320" x2="605" y2="375" stroke="#2872ae" stroke-width="3"/><polygon points="605.0,375.0 599.2,362.3 610.8,362.3" fill="#2872ae"/><line x1="855" y1="320" x2="855" y2="375" stroke="#2872ae" stroke-width="3"/><polygon points="855.0,375.0 849.2,362.3 860.8,362.3" fill="#2872ae"/><rect x="525" y="385" width="165" height="100" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="574.50" y="401.0" font-size="22" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">name</text><text x="588.50" y="441.0" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">氏名</text><rect x="765" y="385" width="165" height="100" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="816.50" y="401.0" font-size="22" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">score</text><text x="828.50" y="441.0" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">点数</text><text x="242.50" y="585" font-size="25" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">独自のタグで、データの意味と階層を表す</text><rect x="36" y="675" width="888" height="62" rx="12" fill="#e4f5ed" stroke="none"/><text x="170.00" y="684" font-size="20" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">タグは用途に合わせて定義できる。表示スタイルは別に指定できる。</text></g></svg>