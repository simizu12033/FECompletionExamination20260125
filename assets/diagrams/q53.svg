<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" role="img" aria-labelledby="title53 desc53"><title id="title53">問53 XBRLの用途</title><desc id="desc53">XBRLは事業報告情報の表現・交換・比較に使う。見た目の保存だけではない。</desc><g font-family="Meiryo,Yu Gothic,sans-serif"><rect x="0" y="0" width="960" height="760" rx="0" fill="#f8fbfe" stroke="none"/><text x="36.00" y="25" font-size="18" fill="#61768a" font-weight="400" dominant-baseline="text-before-edge">問53  /  ビジネスシステム</text><text x="36.00" y="62" font-size="30" fill="#16324f" font-weight="700" dominant-baseline="text-before-edge">XBRLの用途</text><line x1="36" y1="118" x2="924" y2="118" stroke="#bfd0df" stroke-width="1"/><rect x="60" y="180" width="300" height="140" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="115.50" y="213.5" font-size="27" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">事業報告の情報</text><text x="134.00" y="258.5" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">売上高・利益など</text><line x1="370" y1="250" x2="515" y2="250" stroke="#2872ae" stroke-width="3"/><polygon points="515.0,250.0 502.3,255.8 502.3,244.2" fill="#2872ae"/><rect x="382.5" y="217.0" width="120.0" height="27" rx="3" fill="#f8fbfe" stroke="none"/><text x="388.50" y="219.0" font-size="18" fill="#2872ae" font-weight="400" dominant-baseline="text-before-edge">タグを付ける</text><rect x="530" y="180" width="370" height="140" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="673.00" y="212.0" font-size="30" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">XBRL</text><text x="581.00" y="260.0" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">XMLを基盤に項目の意味を表す</text><line x1="715" y1="335" x2="170" y2="450" stroke="#2872ae" stroke-width="3"/><polygon points="170.0,450.0 181.2,441.7 183.7,453.1" fill="#2872ae"/><rect x="75" y="475" width="190" height="100" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="142.00" y="507.0" font-size="28" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">作成</text><line x1="715" y1="335" x2="480" y2="450" stroke="#2872ae" stroke-width="3"/><polygon points="480.0,450.0 488.9,439.2 494.0,449.6" fill="#2872ae"/><rect x="385" y="475" width="190" height="100" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="452.00" y="507.0" font-size="28" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">交換</text><line x1="715" y1="335" x2="790" y2="450" stroke="#2872ae" stroke-width="3"/><polygon points="790.0,450.0 778.2,442.5 787.9,436.2" fill="#2872ae"/><rect x="695" y="475" width="190" height="100" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="762.00" y="507.0" font-size="28" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">比較</text><rect x="36" y="675" width="888" height="62" rx="12" fill="#e4f5ed" stroke="none"/><text x="121.50" y="684" font-size="20" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">XBRLは事業報告情報の表現・交換・比較に使う。見た目の保存だけではない。</text></g></svg>