<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" role="img" aria-labelledby="title35 desc35"><title id="title35">問35 オブジェクト指向の継承</title><desc id="desc35">種類の関係と、部品・属性の関係を分ける。サブクラスはトラック。</desc><g font-family="Meiryo,Yu Gothic,sans-serif"><rect x="0" y="0" width="960" height="760" rx="0" fill="#f8fbfe" stroke="none"/><text x="36.00" y="25" font-size="18" fill="#61768a" font-weight="400" dominant-baseline="text-before-edge">問35  /  システム開発</text><text x="36.00" y="62" font-size="30" fill="#16324f" font-weight="700" dominant-baseline="text-before-edge">オブジェクト指向の継承</text><line x1="36" y1="118" x2="924" y2="118" stroke="#bfd0df" stroke-width="1"/><rect x="325" y="160" width="310" height="100" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="436.50" y="172.5" font-size="29" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">自動車</text><text x="432.50" y="219.5" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">上位クラス</text><line x1="480" y1="277" x2="480" y2="370" stroke="#2872ae" stroke-width="3"/><polygon points="480.0,370.0 474.2,357.3 485.8,357.3" fill="#2872ae"/><rect x="422.0" y="290.5" width="116.0" height="27" rx="3" fill="#f8fbfe" stroke="none"/><text x="428.00" y="292.5" font-size="18" fill="#2872ae" font-weight="400" dominant-baseline="text-before-edge">一種（is-a）</text><rect x="325" y="395" width="310" height="120" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="422.00" y="417.5" font-size="29" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">トラック</text><text x="375.50" y="464.5" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">下位クラス＝サブクラス</text><rect x="45" y="405" width="220" height="110" rx="12" fill="#fff1c9" stroke="#bfd0df"/><text x="67.00" y="426.0" font-size="22" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">エンジン・タイヤ</text><text x="91.50" y="466.0" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">部品（has-a）</text><rect x="695" y="405" width="220" height="110" rx="12" fill="#fff1c9" stroke="#bfd0df"/><text x="755.00" y="424.5" font-size="25" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">製造番号</text><text x="757.50" y="467.5" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">属性・情報</text><text x="230.00" y="595" font-size="25" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">「トラックは自動車である」は自然に言える</text><rect x="36" y="675" width="888" height="62" rx="12" fill="#e4f5ed" stroke="none"/><text x="170.00" y="684" font-size="20" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">種類の関係と、部品・属性の関係を分ける。サブクラスはトラック。</text><text x="924" y="25" font-size="16" fill="#61768a" text-anchor="end" dominant-baseline="text-before-edge">問題に対応</text></g></svg>