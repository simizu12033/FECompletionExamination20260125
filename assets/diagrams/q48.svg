<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" role="img" aria-labelledby="title48 desc48"><title id="title48">問48 システム化構想の立案</title><desc id="desc48">「調査・分析・活用の方向付け」は構想立案。詳細な要求や方式設計より前。</desc><g font-family="Meiryo,Yu Gothic,sans-serif"><rect x="0" y="0" width="960" height="760" rx="0" fill="#f8fbfe" stroke="none"/><text x="36.00" y="25" font-size="18" fill="#61768a" font-weight="400" dominant-baseline="text-before-edge">問48  /  システム戦略</text><text x="36.00" y="62" font-size="30" fill="#16324f" font-weight="700" dominant-baseline="text-before-edge">システム化構想の立案</text><line x1="36" y1="118" x2="924" y2="118" stroke="#bfd0df" stroke-width="1"/><rect x="45" y="230" width="240" height="200" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="95.50" y="280.0" font-size="26" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">① 構想立案</text><text x="98.50" y="324.0" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">技術動向を調査</text><text x="60.50" y="352.0" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">活用の価値・方法を分析</text><line x1="295" y1="330" x2="348" y2="330" stroke="#2872ae" stroke-width="3"/><polygon points="348.0,330.0 335.3,335.8 335.3,324.2" fill="#2872ae"/><rect x="360" y="230" width="240" height="200" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="410.50" y="280.0" font-size="26" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">② 要件定義</text><text x="394.50" y="324.0" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">必要な機能や品質を</text><text x="394.50" y="352.0" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">具体的な条件にする</text><line x1="610" y1="330" x2="663" y2="330" stroke="#2872ae" stroke-width="3"/><polygon points="663.0,330.0 650.3,335.8 650.3,324.2" fill="#2872ae"/><rect x="675" y="230" width="240" height="200" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="751.50" y="280.0" font-size="26" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">③ 設計</text><text x="747.50" y="324.0" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">実現方式や</text><text x="690.50" y="352.0" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">インタフェースを決める</text><text x="189.00" y="550" font-size="24" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">例：AIを顧客対応の省力化・品質向上にどう使えるか</text><text x="215.50" y="605" font-size="23" fill="#61768a" font-weight="400" dominant-baseline="text-before-edge">先に目的と可能性を検討し、後で内容を具体化する</text><rect x="36" y="675" width="888" height="62" rx="12" fill="#e4f5ed" stroke="none"/><text x="130.00" y="684" font-size="20" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">「調査・分析・活用の方向付け」は構想立案。詳細な要求や方式設計より前。</text><text x="924" y="25" font-size="16" fill="#61768a" text-anchor="end" dominant-baseline="text-before-edge">問題に対応</text></g></svg>