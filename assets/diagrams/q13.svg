<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" role="img" aria-labelledby="title13 desc13"><title id="title13">問13 ページ置換のLRU</title><desc id="desc13">「最後の参照から最も長い時間が経ったもの」を選ぶ。使用回数ではない。</desc><g font-family="Meiryo,Yu Gothic,sans-serif"><rect x="0" y="0" width="960" height="760" rx="0" fill="#f8fbfe" stroke="none"/><text x="36.00" y="25" font-size="18" fill="#61768a" font-weight="400" dominant-baseline="text-before-edge">問13  /  ソフトウェア</text><text x="36.00" y="62" font-size="30" fill="#16324f" font-weight="700" dominant-baseline="text-before-edge">ページ置換のLRU</text><line x1="36" y1="118" x2="924" y2="118" stroke="#bfd0df" stroke-width="1"/><text x="213.50" y="150" font-size="23" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">10:10に入替えが必要になったら？（説明用の例）</text><rect x="75" y="210" width="270.0" height="78" rx="0" fill="#16324f" stroke="#bfd0df"/><text x="178.50" y="235.0" font-size="21" fill="white" font-weight="700" dominant-baseline="text-before-edge">ページ</text><rect x="345.0" y="210" width="270.0" height="78" rx="0" fill="#16324f" stroke="#bfd0df"/><text x="396.00" y="235.0" font-size="21" fill="white" font-weight="700" dominant-baseline="text-before-edge">最後に使った時刻</text><rect x="615.0" y="210" width="270.0" height="78" rx="0" fill="#16324f" stroke="#bfd0df"/><text x="666.00" y="235.0" font-size="21" fill="white" font-weight="700" dominant-baseline="text-before-edge">使っていない時間</text><rect x="75" y="288" width="270.0" height="78" rx="0" fill="#e4f5ed" stroke="#bfd0df"/><text x="203.00" y="313.0" font-size="21" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">A</text><rect x="345.0" y="288" width="270.0" height="78" rx="0" fill="#e4f5ed" stroke="#bfd0df"/><text x="449.50" y="313.0" font-size="21" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">10:00</text><rect x="615.0" y="288" width="270.0" height="78" rx="0" fill="#e4f5ed" stroke="#bfd0df"/><text x="688.00" y="313.0" font-size="21" fill="#1