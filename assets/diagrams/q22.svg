<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" role="img" aria-labelledby="title22 desc22"><title id="title22">問22 媒体障害からの回復</title><desc id="desc22">バックアップ＋その後のコミット済みログで回復する。時刻は説明用の例。</desc><g font-family="Meiryo,Yu Gothic,sans-serif"><rect x="0" y="0" width="960" height="760" rx="0" fill="#f8fbfe" stroke="none"/><text x="36.00" y="25" font-size="18" fill="#61768a" font-weight="400" dominant-baseline="text-before-edge">問22  /  データベース</text><text x="36.00" y="62" font-size="30" fill="#16324f" font-weight="700" dominant-baseline="text-before-edge">媒体障害からの回復</text><line x1="36" y1="118" x2="924" y2="118" stroke="#bfd0df" stroke-width="1"/><rect x="65" y="175" width="210" height="105" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="135.50" y="193.5" font-size="22" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">10:00</text><text x="113.00" y="233.5" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">バックアップ</text><rect x="380" y="175" width="210" height="105" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="450.50" y="193.5" font-size="22" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">11:00</text><text x="418.50" y="233.5" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">更新をコミット</text><rect x="695" y="175" width="210" height="105" rx="12" fill="#fff0ed" stroke="#bfd0df"/><text x="765.50" y="193.5" font-size="22" fill="#b34b52" font-weight="700" dominant-baseline="text-before-edge">12:00</text><text x="762.00" y="233.5" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">媒体障害</text><line x1="280" y1="225" x2="370" y2="225" stroke="#2872ae" stroke-width="3"/><polygon points="370.0,225.0 357.3,230.8 357.3,219.2" fill="#2872ae"/><line x1="595" y1="225" x2="685" y2="225" stroke="#2872ae" stroke-width="3"/><polygon points="685.0,225.0 672.3,230.8 672.3,219.2" fill="#2872ae"/><rect x="65" y="400" width="330" height="130" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="171.50" y="431.0" font-size="22" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">① リストア</text><text x="125.50" y="471.0" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">バックアップ時点へ戻す</text><rect x="565" y="400" width="330" height="130" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="627.50" y="431.0" font-size="22" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">② ロールフォワード</text><text x="604.00" y="471.0" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">11時の確定済み更新を再適用</text><line x1="405" y1="465" x2="555" y2="465" stroke="#2872ae" stroke-width="3"/><polygon points="555.0,465.0 542.3,470.8 542.3,459.2" fill="#2872ae"/><rect x="429.0" y="432.0" width="102.0" height="27" rx="3" fill="#f8fbfe" stroke="none"/><text x="435.00" y="434.0" font-size="18" fill="#2872ae" font-weight="400" dominant-baseline="text-before-edge">ログを使う</text><text x="204.00" y="590" font-size="23" fill="#b34b52" font-weight="400" dominant-baseline="text-before-edge">未コミットの更新は、確定済み更新として反映しない</text><rect x="36" y="675" width="888" height="62" rx="12" fill="#e4f5ed" stroke="none"/><text x="140.00" y="684" font-size="20" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">バックアップ＋その後のコミット済みログで回復する。時刻は説明用の例。</text></g></svg>