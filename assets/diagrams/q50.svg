<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" role="img" aria-labelledby="title50 desc50"><title id="title50">問50 コンバージョン率</title><desc id="desc50">購入という成果へ転換した割合＝コンバージョン率。閲覧回数だけでは測れない。</desc><g font-family="Meiryo,Yu Gothic,sans-serif"><rect x="0" y="0" width="960" height="760" rx="0" fill="#f8fbfe" stroke="none"/><text x="36.00" y="25" font-size="18" fill="#61768a" font-weight="400" dominant-baseline="text-before-edge">問50  /  マーケティング</text><text x="36.00" y="62" font-size="30" fill="#16324f" font-weight="700" dominant-baseline="text-before-edge">コンバージョン率</text><line x1="36" y1="118" x2="924" y2="118" stroke="#bfd0df" stroke-width="1"/><text x="264.00" y="150" font-size="24" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">説明用の例：訪問者が同じ1,000人なら</text><rect x="80" y="220" width="200" height="85" rx="0" fill="#16324f" stroke="#bfd0df"/><text x="180.00" y="248.5" font-size="21" fill="white" font-weight="700" dominant-baseline="text-before-edge"></text><rect x="280" y="220" width="200" height="85" rx="0" fill="#16324f" stroke="#bfd0df"/><text x="348.50" y="248.5" font-size="21" fill="white" font-weight="700" dominant-baseline="text-before-edge">訪問者</text><rect x="480" y="220" width="200" height="85" rx="0" fill="#16324f" stroke="#bfd0df"/><text x="548.50" y="248.5" font-size="21" fill="white" font-weight="700" dominant-baseline="text-before-edge">購入者</text><rect x="680" y="220" width="200" height="85" rx="0" fill="#16324f" stroke="#bfd0df"/><text x="757.50" y="248.5" font-size="21" fill="white" font-weight="700" dominant-baseline="text-before-edge">CVR</text><rect x="80" y="305" width="200" height="85" rx="0" fill="white" stroke="#bfd0df"/><text x="148.50" y="333.5" font-size="21" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">変更前</text><rect x="280" y="305" width="200" height="85" rx="0" fill="white" stroke="#bfd0df"/><text x="340.00" y="333.5" font-size="21" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">1,000人</text><rect x="480" y="305" width="200" height="85" rx="0" fill="white" stroke="#bfd0df"/><text x="556.50" y="333.5" font-size="21" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">20人</text><rect x="680" y="305" width="200" height="85" rx="0" fill="white" stroke="#bfd0df"/><text x="763.00" y="333.5" font-size="21" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">2％</text><rect x="80" y="390" width="200" height="85" rx="0" fill="#e4f5ed" stroke="#bfd0df"/><text x="148.50" y="418.5" font-size="21" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">変更後</text><rect x="280" y="390" width="200" height="85" rx="0" fill="#e4f5ed" stroke="#bfd0df"/><text x="340.00" y="418.5" font-size="21" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">1,000人</text><rect x="480" y="390" width="200" height="85" rx="0" fill="#e4f5ed" stroke="#bfd0df"/><text x="556.50" y="418.5" font-size="21" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">30人</text><rect x="680" y="390" width="200" height="85" rx="0" fill="#e4f5ed" stroke="#bfd0df"/><text x="763.00" y="418.5" font-size="21" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">3％</text><line x1="200" y1="548" x2="760" y2="548" stroke="#16324f" stroke-width="3"/><text x="364.00" y="487" font-size="29" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">成果に至った人数</text><text x="318.00" y="565" font-size="27" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">サイトアクセス者の総人数</text><rect x="36" y="675" width="888" height="62" rx="12" fill="#e4f5ed" stroke="none"/><text x="110.00" y="684" font-size="20" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">購入という成果へ転換した割合＝コンバージョン率。閲覧回数だけでは測れない。</text><text x="924" y="25" font-size="16" fill="#61768a" text-anchor="end" dominant-baseline="text-before-edge">説明用の例</text></g></svg>