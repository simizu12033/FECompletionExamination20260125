<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" role="img" aria-labelledby="title45 desc45"><title id="title45">問45 監査における可用性</title><desc id="desc45">サーバ二重化は利用継続を助ける。入力の正しさや権限管理とは別の観点。</desc><g font-family="Meiryo,Yu Gothic,sans-serif"><rect x="0" y="0" width="960" height="760" rx="0" fill="#f8fbfe" stroke="none"/><text x="36.00" y="25" font-size="18" fill="#61768a" font-weight="400" dominant-baseline="text-before-edge">問45  /  システム監査</text><text x="36.00" y="62" font-size="30" fill="#16324f" font-weight="700" dominant-baseline="text-before-edge">監査における可用性</text><line x1="36" y1="118" x2="924" y2="118" stroke="#bfd0df" stroke-width="1"/><rect x="45" y="240" width="240" height="135" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="121.50" y="270.0" font-size="29" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">利用者</text><text x="108.00" y="317.0" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">使い続けたい</text><rect x="540" y="170" width="340" height="130" rx="12" fill="#fff0ed" stroke="#bfd0df"/><text x="619.00" y="198.5" font-size="27" fill="#b34b52" font-weight="700" dominant-baseline="text-before-edge">サーバA：故障</text><text x="672.00" y="243.5" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">使えない</text><rect x="540" y="420" width="340" height="130" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="619.00" y="448.5" font-size="27" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">サーバB：稼働</text><text x="643.50" y="493.5" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">切り替えて継続</text><line x1="295" y1="305" x2="420" y2="305" stroke="#61768a" stroke-width="2"/><line x1="420" y1="305" x2="530" y2="235" stroke="#61768a" stroke-width="3"/><polygon points="530.0,235.0 522.4,246.8 516.1,236.9" fill="#61768a"/><rect x="451.0" y="237.0" width="48.0" height="27" rx="3" fill="#f8fbfe" stroke="none"/><text x="457.00" y="239.0" font-size="18" fill="#61768a" font-weight="400" dominant-baseline="text-before-edge">通常</text><line x1="420" y1="305" x2="530" y2="485" stroke="#087d64" stroke-width="3"/><polygon points="530.0,485.0 518.4,477.2 528.3,471.1" fill="#087d64"/><rect x="442.0" y="362.0" width="66.0" height="27" rx="3" fill="#f8fbfe" stroke="none"/><text x="448.00" y="364.0" font-size="18" fill="#087d64" font-weight="400" dominant-baseline="text-before-edge">切替え</text><text x="250.50" y="605" font-size="27" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">必要なときに利用できること＝可用性</text><rect x="36" y="675" width="888" height="62" rx="12" fill="#e4f5ed" stroke="none"/><text x="140.00" y="684" font-size="20" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">サーバ二重化は利用継続を助ける。入力の正しさや権限管理とは別の観点。</text><text x="924" y="25" font-size="16" fill="#61768a" text-anchor="end" dominant-baseline="text-before-edge">説明用の例</text></g></svg>