<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" role="img" aria-labelledby="title60 desc60"><title id="title60">問60 契約形態とプログラムの著作権</title><desc id="desc60">試験の条件に沿って比較する。請負は受注先、派遣は派遣先が正答。</desc><g font-family="Meiryo,Yu Gothic,sans-serif"><rect x="0" y="0" width="960" height="760" rx="0" fill="#f8fbfe" stroke="none"/><text x="36.00" y="25" font-size="18" fill="#61768a" font-weight="400" dominant-baseline="text-before-edge">問60  /  法務</text><text x="36.00" y="62" font-size="30" fill="#16324f" font-weight="700" dominant-baseline="text-before-edge">契約形態とプログラムの著作権</text><line x1="36" y1="118" x2="924" y2="118" stroke="#bfd0df" stroke-width="1"/><text x="238.50" y="150" font-size="23" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">設問条件：契約に別段の定めがない場合の原則</text><text x="216.00" y="215" font-size="29" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">請負</text><text x="691.00" y="215" font-size="29" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">派遣</text><rect x="65" y="290" width="360" height="135" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="164.00" y="321.0" font-size="27" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">受注先が開発</text><text x="159.50" y="366.0" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">原則：受注先へ帰属</text><rect x="535" y="290" width="360" height="135" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="577.50" y="322.0" font-size="25" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">派遣先の指揮命令で開発</text><text x="629.50" y="365.0" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">原則：派遣先へ帰属</text><rect x="105" y="525" width="750" height="95" rx="12" fill="#fff1c9" stroke="#bfd0df"/><text x="255.00" y="537.0" font-size="25" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">代金を払う側・雇用元だけで判断しない</text><text x="290.00" y="580.0" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">開発主体と職務上の指揮命令関係を整理する</text><rect x="36" y="675" width="888" height="62" rx="12" fill="#e4f5ed" stroke="none"/><text x="170.00" y="684" font-size="20" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">試験の条件に沿って比較する。請負は受注先、派遣は派遣先が正答。</text><text x="924" y="25" font-size="16" fill="#61768a" text-anchor="end" dominant-baseline="text-before-edge">問題に対応</text></g></svg>