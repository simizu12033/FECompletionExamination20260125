<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" role="img" aria-labelledby="title58 desc58"><title id="title58">問58 ヒストグラム</title><desc id="desc58">各階級の度数を長方形の面積で示す。同じ階級幅なら高さで比較できる。</desc><g font-family="Meiryo,Yu Gothic,sans-serif"><rect x="0" y="0" width="960" height="760" rx="0" fill="#f8fbfe" stroke="none"/><text x="36.00" y="25" font-size="18" fill="#61768a" font-weight="400" dominant-baseline="text-before-edge">問58  /  経営工学</text><text x="36.00" y="62" font-size="30" fill="#16324f" font-weight="700" dominant-baseline="text-before-edge">ヒストグラム</text><line x1="36" y1="118" x2="924" y2="118" stroke="#bfd0df" stroke-width="1"/><text x="273.00" y="150" font-size="23" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">点数の分布を表す例（全て同じ階級幅）</text><line x1="130" y1="565" x2="865" y2="565" stroke="#16324f" stroke-width="3"/><line x1="130" y1="565" x2="130" y2="220" stroke="#16324f" stroke-width="3"/><text x="65.00" y="170" font-size="22" fill="#2872ae" font-weight="400" dominant-baseline="text-before-edge">度数</text><rect x="170" y="495" width="130" height="70" rx="0" fill="#e8f1fa" stroke="#2872ae"/><text x="207.00" y="583" font-size="20" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">0〜20</text><rect x="300" y="415" width="130" height="150" rx="0" fill="#e8f1fa" stroke="#2872ae"/><text x="331.00" y="583" font-size="20" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">20〜40</text><rect x="430" y="285" width="130" height="280" rx="0" fill="#e8f1fa" stroke="#2872ae"/><text x="461.00" y="583" font-size="20" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">40〜60</text><rect x="560" y="355" width="130" height="210" rx="0" fill="#e8f1fa" stroke="#2872ae"/><text x="591.00" y="583" font-size="20" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">60〜80</text><rect x="690" y="465" width="130" height="100" rx="0" fill="#e8f1fa" stroke="#2872ae"/><text x="715.00" y="583" font-size="20" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">80〜100</text><text x="381.00" y="626" font-size="22" fill="#2872ae" font-weight="400" dominant-baseline="text-before-edge">階級（点数の範囲）</text><rect x="36" y="675" width="888" height="62" rx="12" fill="#e4f5ed" stroke="none"/><text x="150.00" y="684" font-size="20" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">各階級の度数を長方形の面積で示す。同じ階級幅なら高さで比較できる。</text></g></svg>