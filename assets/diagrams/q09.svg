<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" role="img" aria-labelledby="title9 desc9"><title id="title9">問9 記憶装置のアクセス速度</title><desc id="desc9">選択肢の中で最速は、CPU内部のレジスタ。容量の大きさとは別。</desc><g font-family="Meiryo,Yu Gothic,sans-serif"><rect x="0" y="0" width="960" height="760" rx="0" fill="#f8fbfe" stroke="none"/><text x="36.00" y="25" font-size="18" fill="#61768a" font-weight="400" dominant-baseline="text-before-edge">問09  /  ハードウェア</text><text x="36.00" y="62" font-size="30" fill="#16324f" font-weight="700" dominant-baseline="text-before-edge">記憶装置のアクセス速度</text><line x1="36" y1="118" x2="924" y2="118" stroke="#bfd0df" stroke-width="1"/><rect x="325.0" y="165" width="310" height="91" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="436.00" y="176.5" font-size="22" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">レジスタ</text><text x="385.00" y="216.5" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">CPUの演算が直接使う</text><rect x="260.0" y="278" width="440" height="91" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="406.50" y="289.5" font-size="22" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">2次キャッシュ</text><text x="366.00" y="329.5" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">主記憶との速度差を埋める</text><rect x="190.0" y="391" width="580" height="91" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="447.00" y="402.5" font-size="22" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">主記憶</text><text x="356.50" y="442.5" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">実行中のプログラムやデータ</text><rect x="115.0" y="504" width="730" height="91" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="414.00" y="515.5" font-size="22" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">磁気ディスク</text><text x="356.50" y="555.5" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">大容量・機械的な待ちがある</text><line x1="890" y1="200" x2="890" y2="570" stroke="#61768a" stroke-width="3"/><polygon points="890.0,570.0 884.2,557.3 895.8,557.3" fill="#61768a"/><text x="80.00" y="180" font-size="25" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">速い</text><text x="80.00" y="570" font-size="25" fill="#61768a" font-weight="700" dominant-baseline="text-before-edge">遅い</text><rect x="36" y="675" width="888" height="62" rx="12" fill="#e4f5ed" stroke="none"/><text x="178.00" y="684" font-size="20" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">選択肢の中で最速は、CPU内部のレジスタ。容量の大きさとは別。</text><text x="924" y="25" font-size="16" fill="#61768a" text-anchor="end" dominant-baseline="text-before-edge">概念の整理</text></g></svg>