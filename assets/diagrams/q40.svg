<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" role="img" aria-labelledby="title40 desc40"><title id="title40">問40 リファクタリング</title><desc id="desc40">外から見た動作を変えず、内部を読みやすく保守しやすい構造にする。</desc><g font-family="Meiryo,Yu Gothic,sans-serif"><rect x="0" y="0" width="960" height="760" rx="0" fill="#f8fbfe" stroke="none"/><text x="36.00" y="25" font-size="18" fill="#61768a" font-weight="400" dominant-baseline="text-before-edge">問40  /  システム開発</text><text x="36.00" y="62" font-size="30" fill="#16324f" font-weight="700" dominant-baseline="text-before-edge">リファクタリング</text><line x1="36" y1="118" x2="924" y2="118" stroke="#bfd0df" stroke-width="1"/><rect x="50" y="190" width="350" height="140" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="169.00" y="223.0" font-size="28" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">同じ入力</text><text x="158.50" y="269.0" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">例：数量と単価</text><rect x="560" y="190" width="350" height="140" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="679.00" y="223.0" font-size="28" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">同じ出力</text><text x="649.50" y="269.0" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">例：計算された合計</text><line x1="410" y1="260" x2="550" y2="260" stroke="#087d64" stroke-width="3"/><polygon points="550.0,260.0 537.3,265.8 537.3,254.2" fill="#087d64"/><rect x="411.0" y="227.0" width="138.0" height="27" rx="3" fill="#f8fbfe" stroke="none"/><text x="417.00" y="229.0" font-size="18" fill="#087d64" font-weight="400" dominant-baseline="text-before-edge">振る舞いを維持</text><rect x="90" y="450" width="340" height="140" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="194.00" y="486.0" font-size="22" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">内部：変更前</text><text x="146.00" y="526.0" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">重複した計算・複雑な構造</text><rect x="530" y="450" width="340" height="140" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="634.00" y="486.0" font-size="22" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">内部：変更後</text><text x="586.00" y="526.0" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">共通の関数・整理した構造</text><line x1="440" y1="520" x2="520" y2="520" stroke="#2872ae" stroke-width="3"/><polygon points="520.0,520.0 507.3,525.8 507.3,514.2" fill="#2872ae"/><rect x="456.0" y="487.0" width="48.0" height="27" rx="3" fill="#f8fbfe" stroke="none"/><text x="462.00" y="489.0" font-size="18" fill="#2872ae" font-weight="400" dominant-baseline="text-before-edge">改善</text><rect x="36" y="675" width="888" height="62" rx="12" fill="#e4f5ed" stroke="none"/><text x="160.00" y="684" font-size="20" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">外から見た動作を変えず、内部を読みやすく保守しやすい構造にする。</text></g></svg>