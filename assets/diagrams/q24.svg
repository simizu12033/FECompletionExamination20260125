<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" role="img" aria-labelledby="title24 desc24"><title id="title24">問24 ビット誤り率の計算</title><desc id="desc24">ビット誤り率＝誤りビット数÷総送信ビット数。バイト換算は不要。</desc><g font-family="Meiryo,Yu Gothic,sans-serif"><rect x="0" y="0" width="960" height="760" rx="0" fill="#f8fbfe" stroke="none"/><text x="36.00" y="25" font-size="18" fill="#61768a" font-weight="400" dominant-baseline="text-before-edge">問24  /  ネットワーク</text><text x="36.00" y="62" font-size="30" fill="#16324f" font-weight="700" dominant-baseline="text-before-edge">ビット誤り率の計算</text><line x1="36" y1="118" x2="924" y2="118" stroke="#bfd0df" stroke-width="1"/><rect x="65" y="175" width="330" height="115" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="135.00" y="197.0" font-size="25" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">30 Mビット／秒</text><text x="127.50" y="240.0" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">毎秒30,000,000ビット</text><rect x="565" y="175" width="330" height="115" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="613.00" y="197.0" font-size="25" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">100秒間 送り続ける</text><text x="638.50" y="240.0" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">この間に1ビット誤り</text><text x="240.00" y="330" font-size="28" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">30 × 10⁶ × 100 ＝ 3 × 10⁹ ビット</text><line x1="145" y1="505" x2="815" y2="505" stroke="#16324f" stroke-width="3"/><text x="380.00" y="444" font-size="30" fill="#b34b52" font-weight="700" dominant-baseline="text-before-edge">誤り：1ビット</text><text x="314.00" y="522" font-size="29" fill="#16324f" font-weight="700" dominant-baseline="text-before-edge">総送信：3 × 10⁹ ビット</text><text x="349.50" y="603" font-size="32" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">＝ 3.33 × 10⁻¹⁰</text><rect x="36" y="675" width="888" height="62" rx="12" fill="#e4f5ed" stroke="none"/><text x="171.50" y="684" font-size="20" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">ビット誤り率＝誤りビット数÷総送信ビット数。バイト換算は不要。</text><text x="924" y="25" font-size="16" fill="#61768a" text-anchor="end" dominant-baseline="text-before-edge">問題に対応</text></g></svg>