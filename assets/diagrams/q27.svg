<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" role="img" aria-labelledby="title27 desc27"><title id="title27">問27 パスワードの総数</title><desc id="desc27">各文字位置でM種類を選べる。重複を許し、順序を区別する。</desc><g font-family="Meiryo,Yu Gothic,sans-serif"><rect x="0" y="0" width="960" height="760" rx="0" fill="#f8fbfe" stroke="none"/><text x="36.00" y="25" font-size="18" fill="#61768a" font-weight="400" dominant-baseline="text-before-edge">問27  /  セキュリティ</text><text x="36.00" y="62" font-size="30" fill="#16324f" font-weight="700" dominant-baseline="text-before-edge">パスワードの総数</text><line x1="36" y1="118" x2="924" y2="118" stroke="#bfd0df" stroke-width="1"/><text x="278.00" y="155" font-size="24" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">例：2種類（A・B）から3文字を作る</text><rect x="65" y="235" width="210" height="100" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="129.50" y="251.0" font-size="22" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">1文字目</text><text x="145.00" y="291.0" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">2通り</text><rect x="375" y="235" width="210" height="100" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="439.50" y="251.0" font-size="22" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">2文字目</text><text x="455.00" y="291.0" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">2通り</text><rect x="685" y="235" width="210" height="100" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="749.50" y="251.0" font-size="22" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">3文字目</text><text x="765.00" y="291.0" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">2通り</text><text x="311.00" y="267" font-size="35" fill="#2872ae" font-weight="400" dominant-baseline="text-before-edge">×</text><text x="621.00" y="267" font-size="35" fill="#2872ae" font-weight="400" dominant-baseline="text-before-edge">×</text><rect x="100" y="410" width="380.0" height="63" rx="0" fill="#16324f" stroke="#bfd0df"/><text x="240.00" y="427.5" font-size="21" fill="white" font-weight="700" dominant-baseline="text-before-edge">Aで始まる</text><rect x="480.0" y="410" width="380.0" height="63" rx="0" fill="#16324f" stroke="#bfd0df"/><text x="620.50" y="427.5" font-size="21" fill="white" font-weight="700" dominant-baseline="text-before-edge">Bで始まる</text><rect x="100" y="473" width="380.0" height="63" rx="0" fill="white" stroke="#bfd0df"/><text x="237.50" y="490.5" font-size="21" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">AAA・AAB</text><rect x="480.0" y="473" width="380.0" height="63" rx="0" fill="white" stroke="#bfd0df"/><text x="617.50" y="490.5" font-size="21" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">BAA・BAB</text><rect x="100" y="536" width="380.0" height="63" rx="0" fill="white" stroke="#bfd0df"/><text x="237.50" y="553.5" font-size="21" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">ABA・ABB</text><rect x="480.0" y="536" width="380.0" height="63" rx="0" fill="white" stroke="#bfd0df"/><text x="617.50" y="553.5" font-size="21" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">BBA・BBB</text><text x="248.50" y="620" font-size="29" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">2³＝8通り　→　一般には Mⁿ 通り</text><rect x="36" y="675" width="888" height="62" rx="12" fill="#e4f5ed" stroke="none"/><text x="201.00" y="684" font-size="20" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">各文字位置でM種類を選べる。重複を許し、順序を区別する。</text></g></svg>