<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" role="img" aria-labelledby="title25 desc25"><title id="title25">問25 DHCPの役割</title><desc id="desc25">DHCPは、端末自身が使うネットワーク設定を自動配布する。</desc><g font-family="Meiryo,Yu Gothic,sans-serif"><rect x="0" y="0" width="960" height="760" rx="0" fill="#f8fbfe" stroke="none"/><text x="36.00" y="25" font-size="18" fill="#61768a" font-weight="400" dominant-baseline="text-before-edge">問25  /  ネットワーク</text><text x="36.00" y="62" font-size="30" fill="#16324f" font-weight="700" dominant-baseline="text-before-edge">DHCPの役割</text><line x1="36" y1="118" x2="924" y2="118" stroke="#bfd0df" stroke-width="1"/><rect x="70" y="190" width="300" height="155" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="128.00" y="233.5" font-size="22" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">新しく接続したPC</text><text x="153.50" y="273.5" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">IP設定がほしい</text><rect x="590" y="190" width="300" height="155" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="674.50" y="233.5" font-size="22" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">DHCPサーバ</text><text x="673.50" y="273.5" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">設定情報を管理</text><line x1="385" y1="235" x2="575" y2="235" stroke="#2872ae" stroke-width="3"/><polygon points="575.0,235.0 562.3,240.8 562.3,229.2" fill="#2872ae"/><rect x="429.0" y="202.0" width="102.0" height="27" rx="3" fill="#f8fbfe" stroke="none"/><text x="435.00" y="204.0" font-size="18" fill="#2872ae" font-weight="400" dominant-baseline="text-before-edge">設定を要求</text><line x1="575" y1="320" x2="385" y2="320" stroke="#2872ae" stroke-width="3"/><polygon points="385.0,320.0 397.7,314.2 397.7,325.8" fill="#2872ae"/><rect x="429.0" y="330.0" width="102.0" height="27" rx="3" fill="#f8fbfe" stroke="none"/><text x="435.00" y="332.0" font-size="18" fill="#2872ae" font-weight="400" dominant-baseline="text-before-edge">設定を配布</text><rect x="130" y="440" width="330" height="48" rx="0" fill="#16324f" stroke="#bfd0df"/><text x="215.00" y="450.5" font-size="20" fill="white" font-weight="700" dominant-baseline="text-before-edge">配布する設定の例</text><rect x="460" y="440" width="370" height="48" rx="0" fill="#16324f" stroke="#bfd0df"/><text x="625.00" y="450.5" font-size="20" fill="white" font-weight="700" dominant-baseline="text-before-edge">役割</text><rect x="130" y="488" width="330" height="48" rx="0" fill="white" stroke="#bfd0df"/><text x="245.00" y="498.5" font-size="20" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">IPアドレス</text><rect x="460" y="488" width="370" height="48" rx="0" fill="white" stroke="#bfd0df"/><text x="575.00" y="498.5" font-size="20" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">端末のアドレス</text><rect x="130" y="536" width="330" height="48" rx="0" fill="white" stroke="#bfd0df"/><text x="215.00" y="546.5" font-size="20" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">サブネットマスク</text><rect x="460" y="536" width="370" height="48" rx="0" fill="white" stroke="#bfd0df"/><text x="565.00" y="546.5" font-size="20" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">ネットワーク範囲</text><rect x="130" y="584" width="330" height="48" rx="0" fill="white" stroke="#bfd0df"/><text x="185.00" y="594.5" font-size="20" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">デフォルトゲートウェイ</text><rect x="460" y="584" width="370" height="48" rx="0" fill="white" stroke="#bfd0df"/><text x="535.00" y="594.5" font-size="20" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">他ネットワークへの出口</text><rect x="36" y="675" width="888" height="62" rx="12" fill="#e4f5ed" stroke="none"/><text x="200.00" y="684" font-size="20" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">DHCPは、端末自身が使うネットワーク設定を自動配布する。</text><text x="924" y="25" font-size="16" fill="#61768a" text-anchor="end" dominant-baseline="text-before-edge">説明用の例</text></g></svg>