<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" role="img" aria-labelledby="title11 desc11"><title id="title11">問11 分散システムのアクセス透過性</title><desc id="desc11">アクセス透過性＝資源が分散していても、同じ操作で利用できる。</desc><g font-family="Meiryo,Yu Gothic,sans-serif"><rect x="0" y="0" width="960" height="760" rx="0" fill="#f8fbfe" stroke="none"/><text x="36.00" y="25" font-size="18" fill="#61768a" font-weight="400" dominant-baseline="text-before-edge">問11  /  システム構成</text><text x="36.00" y="62" font-size="30" fill="#16324f" font-weight="700" dominant-baseline="text-before-edge">分散システムのアクセス透過性</text><line x1="36" y1="118" x2="924" y2="118" stroke="#bfd0df" stroke-width="1"/><rect x="330" y="150" width="300" height="95" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="403.00" y="163.5" font-size="22" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">利用者・アプリ</text><text x="404.00" y="203.5" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">同じ「開く」操作</text><line x1="400" y1="250" x2="250" y2="350" stroke="#2872ae" stroke-width="3"/><polygon points="250.0,350.0 257.4,338.1 263.8,347.8" fill="#2872ae"/><rect x="297.5" y="267.0" width="55.0" height="27" rx="3" fill="#f8fbfe" stroke="none"/><text x="303.50" y="269.0" font-size="18" fill="#2872ae" font-weight="400" dominant-baseline="text-before-edge">open</text><line x1="560" y1="250" x2="710" y2="350" stroke="#2872ae" stroke-width="3"/><polygon points="710.0,350.0 696.2,347.8 702.6,338.1" fill="#2872ae"/><rect x="607.5" y="267.0" width="55.0" height="27" rx="3" fill="#f8fbfe" stroke="none"/><text x="613.50" y="269.0" font-size="18" fill="#2872ae" font-weight="400" dominant-baseline="text-before-edge">open</text><rect x="90" y="375" width="320" height="130" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="195.00" y="406.0" font-size="22" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">手元の資源</text><text x="164.50" y="446.0" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">ローカルのファイル</text><rect x="550" y="375" width="320" height="130" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="644.00" y="406.0" font-size="22" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">遠隔地の資源</text><text x="596.00" y="446.0" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">ネットワーク先のファイル</text><rect x="90" y="550" width="780" height="80" rx="12" fill="#e4f5ed" stroke="none"/><text x="228.00" y="574" font-size="24" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">場所やアクセス方式の違いを意識しなくてよい</text><rect x="36" y="675" width="888" height="62" rx="12" fill="#e4f5ed" stroke="none"/><text x="180.00" y="684" font-size="20" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">アクセス透過性＝資源が分散していても、同じ操作で利用できる。</text><text x="924" y="25" font-size="16" fill="#61768a" text-anchor="end" dominant-baseline="text-before-edge">説明用の例</text></g></svg>