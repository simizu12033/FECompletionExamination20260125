<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" role="img" aria-labelledby="title33 desc33"><title id="title33">問33 WAFの役割</title><desc id="desc33">ファイル全般やOS全体ではなく、Webアプリケーションへの攻撃を防ぐ。</desc><g font-family="Meiryo,Yu Gothic,sans-serif"><rect x="0" y="0" width="960" height="760" rx="0" fill="#f8fbfe" stroke="none"/><text x="36.00" y="25" font-size="18" fill="#61768a" font-weight="400" dominant-baseline="text-before-edge">問33  /  セキュリティ</text><text x="36.00" y="62" font-size="30" fill="#16324f" font-weight="700" dominant-baseline="text-before-edge">WAFの役割</text><line x1="36" y1="118" x2="924" y2="118" stroke="#bfd0df" stroke-width="1"/><rect x="50" y="190" width="230" height="140" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="99.00" y="226.0" font-size="22" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">利用者・外部</text><text x="93.00" y="266.0" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">HTTPリクエスト</text><rect x="370" y="190" width="220" height="140" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="446.51" y="209.0" font-size="28" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">WAF</text><text x="383.01" y="255.0" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">Webアプリ向け通信を</text><text x="461.00" y="283.0" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">検査</text><rect x="680" y="190" width="230" height="140" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="736.01" y="226.0" font-size="22" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">Webアプリ</text><text x="738.00" y="266.0" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">保護する対象</text><line x1="290" y1="260" x2="360" y2="260" stroke="#2872ae" stroke-width="3"/><polygon points="360.0,260.0 347.3,265.8 347.3,254.2" fill="#2872ae"/><line x1="600" y1="260" x2="670" y2="260" stroke="#087d64" stroke-width="3"/><polygon points="670.0,260.0 657.3,265.8 657.3,254.2" fill="#087d64"/><rect x="611.0" y="227.0" width="48.0" height="27" rx="3" fill="#f8fbfe" stroke="none"/><text x="617.00" y="229.0" font-size="18" fill="#087d64" font-weight="400" dominant-baseline="text-before-edge">通す</text><line x1="480" y1="345" x2="480" y2="445" stroke="#b34b52" stroke-width="3"/><polygon points="480.0,445.0 474.2,432.3 485.8,432.3" fill="#b34b52"/><rect x="429.0" y="383.0" width="102.0" height="27" rx="3" fill="#f8fbfe" stroke="none"/><text x="435.00" y="385.0" font-size="18" fill="#b34b52" font-weight="400" dominant-baseline="text-before-edge">不正な要求</text><rect x="320" y="465" width="320" height="100" rx="12" fill="#fff0ed" stroke="#bfd0df"/><text x="425.00" y="481.0" font-size="22" fill="#b34b52" font-weight="700" dominant-baseline="text-before-edge">検知・遮断</text><text x="354.51" y="521.0" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">攻撃をWebアプリへ渡さない</text><text x="248.52" y="615" font-size="27" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">WAF ＝ Web Application Firewall</text><rect x="36" y="675" width="888" height="62" rx="12" fill="#e4f5ed" stroke="none"/><text x="142.51" y="684" font-size="20" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">ファイル全般やOS全体ではなく、Webアプリケーションへの攻撃を防ぐ。</text></g></svg>