<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" role="img" aria-labelledby="title14 desc14"><title id="title14">問14 コンパイラの最適化</title><desc id="desc14">同じ結果を保ちながら、不要な処理を減らす＝コンパイラの最適化。</desc><g font-family="Meiryo,Yu Gothic,sans-serif"><rect x="0" y="0" width="960" height="760" rx="0" fill="#f8fbfe" stroke="none"/><text x="36.00" y="25" font-size="18" fill="#61768a" font-weight="400" dominant-baseline="text-before-edge">問14  /  ソフトウェア</text><text x="36.00" y="62" font-size="30" fill="#16324f" font-weight="700" dominant-baseline="text-before-edge">コンパイラの最適化</text><line x1="36" y1="118" x2="924" y2="118" stroke="#bfd0df" stroke-width="1"/><rect x="45" y="170" width="390" height="280" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="186.00" y="245.5" font-size="27" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">最適化前</text><text x="173.50" y="290.5" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">繰返しのたびに</text><text x="193.50" y="318.5" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">a ＝ 2 × 3</text><text x="145.00" y="346.5" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">同じ計算を何度も実行</text><rect x="525" y="170" width="390" height="280" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="666.00" y="245.5" font-size="27" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">最適化後</text><text x="630.00" y="290.5" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">先に a ＝ 6 と求める</text><text x="629.00" y="318.5" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">繰返しではaを再利用</text><text x="672.50" y="346.5" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">結果は同じ</text><line x1="442" y1="310" x2="515" y2="310" stroke="#2872ae" stroke-width="3"/><polygon points="515.0,310.0 502.3,315.8 502.3,304.2" fill="#2872ae"/><rect x="120" y="525" width="720" height="105" rx="12" fill="#fff1c9" stroke="#bfd0df"/><text x="228.00" y="542.5" font-size="24" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">狙い：生成したプログラムの実行効率を上げる</text><text x="309.00" y="584.5" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">コンパイル時間が短くなるとは限らない</text><rect x="36" y="675" width="888" height="62" rx="12" fill="#e4f5ed" stroke="none"/><text x="170.00" y="684" font-size="20" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">同じ結果を保ちながら、不要な処理を減らす＝コンパイラの最適化。</text><text x="924" y="25" font-size="16" fill="#61768a" text-anchor="end" dominant-baseline="text-before-edge">説明用の例</text></g></svg>