<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" role="img" aria-labelledby="title17 desc17"><title id="title17">問17 CGの隠線・隠面消去</title><desc id="desc17">手前に遮られて見えない線・面を描かない。画面外の切取りとは別。</desc><g font-family="Meiryo,Yu Gothic,sans-serif"><rect x="0" y="0" width="960" height="760" rx="0" fill="#f8fbfe" stroke="none"/><text x="36.00" y="25" font-size="18" fill="#61768a" font-weight="400" dominant-baseline="text-before-edge">問17  /  情報メディア</text><text x="36.00" y="62" font-size="30" fill="#16324f" font-weight="700" dominant-baseline="text-before-edge">CGの隠線・隠面消去</text><line x1="36" y1="118" x2="924" y2="118" stroke="#bfd0df" stroke-width="1"/><text x="159.00" y="160" font-size="24" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">全ての線を描くと</text><rect x="150" y="235" width="245" height="220" rx="0" fill="#e8f1fa" stroke="#2872ae"/><rect x="80" y="325" width="240" height="220" rx="0" fill="#e4f5ed" stroke="#087d64"/><line x1="150" y1="325" x2="150" y2="455" stroke="#b34b52" stroke-width="3" stroke-dasharray="7 5"/><line x1="150" y1="455" x2="320" y2="455" stroke="#b34b52" stroke-width="3" stroke-dasharray="7 5"/><text x="150.00" y="565" font-size="20" fill="#087d64" font-weight="400" dominant-baseline="text-before-edge">手前の物体</text><text x="573.00" y="160" font-size="24" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">隠れた部分を消去すると</text><rect x="600" y="235" width="245" height="220" rx="0" fill="#e8f1fa" stroke="#2872ae"/><rect x="530" y="325" width="240" height="220" rx="0" fill="#e4f5ed" stroke="#087d64"/><text x="600.00" y="565" font-size="20" fill="#087d64" font-weight="400" dominant-baseline="text-before-edge">手前の物体</text><line x1="450" y1="390" x2="497" y2="390" stroke="#2872ae" stroke-width="3"/><polygon points="497.0,390.0 484.3,395.8 484.3,384.2" fill="#2872ae"/><rect x="36" y="675" width="888" height="62" rx="12" fill="#e4f5ed" stroke="none"/><text x="170.00" y="684" font-size="20" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">手前に遮られて見えない線・面を描かない。画面外の切取りとは別。</text></g></svg>