<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" role="img" aria-labelledby="title5 desc5"><title id="title5">問5 スタックの取出し順序</title><desc id="desc5">A、B、Cの順に積むと、最後のCから取り出す＝LIFO。</desc><g font-family="Meiryo,Yu Gothic,sans-serif"><rect x="0" y="0" width="960" height="760" rx="0" fill="#f8fbfe" stroke="none"/><text x="36.00" y="25" font-size="18" fill="#61768a" font-weight="400" dominant-baseline="text-before-edge">問05  /  アルゴリズム</text><text x="36.00" y="62" font-size="30" fill="#16324f" font-weight="700" dominant-baseline="text-before-edge">スタックの取出し順序</text><line x1="36" y1="118" x2="924" y2="118" stroke="#bfd0df" stroke-width="1"/><text x="76.00" y="150" font-size="23" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">スタック：上から積み、上から取る</text><line x1="70" y1="225" x2="70" y2="510" stroke="#2872ae" stroke-width="3"/><line x1="70" y1="510" x2="200" y2="510" stroke="#2872ae" stroke-width="3"/><line x1="200" y1="225" x2="200" y2="510" stroke="#2872ae" stroke-width="3"/><rect x="77" y="440" width="116" height="65" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="125.50" y="456.0" font-size="25" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">A</text><text x="98.00" y="535" font-size="20" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">Aを積む</text><line x1="250" y1="225" x2="250" y2="510" stroke="#2872ae" stroke-width="3"/><line x1="250" y1="510" x2="380" y2="510" stroke="#2872ae" stroke-width="3"/><line x1="380" y1="225" x2="380" y2="510" stroke="#2872ae" stroke-width="3"/><rect x="257" y="440" width="116" height="65" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="305.50" y="456.0" font-size="25" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">A</text><rect x="257" y="366" width="116" height="65" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="306.00" y="382.0" font-size="25" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">B</text><text x="278.50" y="535" font-size="20" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">Bを積む</text><line x1="430" y1="225" x2="430" y2="510" stroke="#2872ae" stroke-width="3"/><line x1="430" y1="510" x2="560" y2="510" stroke="#2872ae" stroke-width="3"/><line x1="560" y1="225" x2="560" y2="510" stroke="#2872ae" stroke-width="3"/><rect x="437" y="440" width="116" height="65" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="485.50" y="456.0" font-size="25" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">A</text><rect x="437" y="366" width="116" height="65" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="486.00" y="382.0" font-size="25" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">B</text><rect x="437" y="292" width="116" height="65" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="486.50" y="308.0" font-size="25" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">C</text><text x="458.50" y="535" font-size="20" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">Cを積む</text><line x1="583" y1="255" x2="690" y2="255" stroke="#2872ae" stroke-width="3"/><polygon points="690.0,255.0 677.3,260.8 677.3,249.2" fill="#2872ae"/><rect x="603.5" y="222.0" width="66.0" height="27" rx="3" fill="#f8fbfe" stroke="none"/><text x="609.50" y="224.0" font-size="18" fill="#2872ae" font-weight="400" dominant-baseline="text-before-edge">取出し</text><rect x="710" y="210" width="185" height="110" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="743.00" y="231.0" font-size="22" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">C → B → A</text><text x="745.50" y="271.0" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">後入れ先出し</text><rect x="650" y="440" width="250" height="130" rx="12" fill="#fff1c9" stroke="#bfd0df"/><text x="702.50" y="457.0" font-size="22" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">キューはFIFO</text><text x="724.50" y="497.0" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">A → B → C</text><text x="718.00" y="525.0" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">先入れ先出し</text><rect x="36" y="675" width="888" height="62" rx="12" fill="#e4f5ed" stroke="none"/><text x="226.00" y="684" font-size="20" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">A、B、Cの順に積むと、最後のCから取り出す＝LIFO。</text><text x="924" y="25" font-size="16" fill="#61768a" text-anchor="end" dominant-baseline="text-before-edge">説明用の例</text></g></svg>