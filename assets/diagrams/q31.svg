<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" role="img" aria-labelledby="title31 desc31"><title id="title31">問31 フォールスネガティブ</title><desc id="desc31">フォールスネガティブは「感染しているのに、感染していないと判定」。</desc><g font-family="Meiryo,Yu Gothic,sans-serif"><rect x="0" y="0" width="960" height="760" rx="0" fill="#f8fbfe" stroke="none"/><text x="36.00" y="25" font-size="18" fill="#61768a" font-weight="400" dominant-baseline="text-before-edge">問31  /  セキュリティ</text><text x="36.00" y="62" font-size="30" fill="#16324f" font-weight="700" dominant-baseline="text-before-edge">フォールスネガティブ</text><line x1="36" y1="118" x2="924" y2="118" stroke="#bfd0df" stroke-width="1"/><rect x="70" y="190" width="230" height="100" rx="0" fill="#16324f" stroke="#bfd0df"/><text x="119.50" y="225.0" font-size="23" fill="white" font-weight="700" dominant-baseline="text-before-edge">実態 ＼ 判定</text><rect x="300" y="190" width="295" height="100" rx="0" fill="#16324f" stroke="#bfd0df"/><text x="378.50" y="225.0" font-size="23" fill="white" font-weight="700" dominant-baseline="text-before-edge">感染している</text><rect x="595" y="190" width="295" height="100" rx="0" fill="#16324f" stroke="#bfd0df"/><text x="662.00" y="225.0" font-size="23" fill="white" font-weight="700" dominant-baseline="text-before-edge">感染していない</text><rect x="70" y="290" width="230" height="100" rx="0" fill="white" stroke="#bfd0df"/><text x="127.50" y="325.0" font-size="23" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">実際に感染</text><rect x="300" y="290" width="295" height="100" rx="0" fill="white" stroke="#bfd0df"/><text x="344.00" y="325.0" font-size="23" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">真陽性：正しく検知</text><rect x="595" y="290" width="295" height="100" rx="0" fill="white" stroke="#bfd0df"/><text x="662.00" y="325.0" font-size="23" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">偽陰性：見逃し</text><rect x="70" y="390" width="230" height="100" rx="0" fill="white" stroke="#bfd0df"/><text x="116.00" y="425.0" font-size="23" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">実際は非感染</text><rect x="300" y="390" width="295" height="100" rx="0" fill="white" stroke="#bfd0df"/><text x="367.00" y="425.0" font-size="23" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">偽陽性：誤検知</text><rect x="595" y="390" width="295" height="100" rx="0" fill="white" stroke="#bfd0df"/><text x="662.00" y="425.0" font-size="23" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">真陰性：正しい</text><rect x="600" y="290" width="290" height="99" rx="0" fill="#fff1c9" stroke="#b34b52"/><text x="704.50" y="309" font-size="27" fill="#b34b52" font-weight="700" dominant-baseline="text-before-edge">偽陰性</text><text x="676.00" y="351" font-size="23" fill="#b34b52" font-weight="400" dominant-baseline="text-before-edge">感染を見逃す</text><rect x="165" y="555" width="630" height="90" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="274.01" y="564.5" font-size="25" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">False Negative ＝ 誤った陰性判定</text><text x="318.50" y="607.5" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">陰性＝「感染していない」という判定</text><rect x="36" y="675" width="888" height="62" rx="12" fill="#e4f5ed" stroke="none"/><text x="150.00" y="684" font-size="20" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">フォールスネガティブは「感染しているのに、感染していないと判定」。</text></g></svg>