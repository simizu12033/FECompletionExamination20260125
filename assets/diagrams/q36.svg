<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" role="img" aria-labelledby="title36 desc36"><title id="title36">問36 デザインレビューの目的</title><desc id="desc36">デザインレビューは、不備を早期発見して後工程の手戻りを減らす。</desc><g font-family="Meiryo,Yu Gothic,sans-serif"><rect x="0" y="0" width="960" height="760" rx="0" fill="#f8fbfe" stroke="none"/><text x="36.00" y="25" font-size="18" fill="#61768a" font-weight="400" dominant-baseline="text-before-edge">問36  /  システム開発</text><text x="36.00" y="62" font-size="30" fill="#16324f" font-weight="700" dominant-baseline="text-before-edge">デザインレビューの目的</text><line x1="36" y1="118" x2="924" y2="118" stroke="#bfd0df" stroke-width="1"/><rect x="55" y="190" width="230" height="130" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="142.00" y="218.0" font-size="28" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">設計</text><text x="103.50" y="264.0" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">不備を見付ける</text><rect x="365" y="190" width="230" height="130" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="452.00" y="218.0" font-size="28" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">実装</text><text x="423.00" y="264.0" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">コードを作る</text><rect x="675" y="190" width="230" height="130" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="748.00" y="218.0" font-size="28" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">テスト</text><text x="723.50" y="264.0" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">動作を確かめる</text><line x1="295" y1="255" x2="355" y2="255" stroke="#2872ae" stroke-width="3"/><polygon points="355.0,255.0 342.3,260.8 342.3,249.2" fill="#2872ae"/><line x1="605" y1="255" x2="665" y2="255" stroke="#2872ae" stroke-width="3"/><polygon points="665.0,255.0 652.3,260.8 652.3,249.2" fill="#2872ae"/><rect x="100" y="420" width="340" height="150" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="170.00" y="459.5" font-size="25" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">早く発見した場合</text><text x="165.50" y="502.5" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">設計の修正で対応できる</text><rect x="520" y="420" width="340" height="150" rx="12" fill="#fff0ed" stroke="#bfd0df"/><text x="577.50" y="445.5" font-size="25" fill="#b34b52" font-weight="700" dominant-baseline="text-before-edge">後から発見した場合</text><text x="585.50" y="488.5" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">設計・実装・テストまで</text><text x="595.00" y="516.5" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">修正範囲が広がり得る</text><rect x="36" y="675" width="888" height="62" rx="12" fill="#e4f5ed" stroke="none"/><text x="170.00" y="684" font-size="20" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">デザインレビューは、不備を早期発見して後工程の手戻りを減らす。</text><text x="924" y="25" font-size="16" fill="#61768a" text-anchor="end" dominant-baseline="text-before-edge">概念の整理</text></g></svg>