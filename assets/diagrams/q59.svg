<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" role="img" aria-labelledby="title59 desc59"><title id="title59">問59 ROIの意味</title><desc id="desc59">ROIは投資利益率。分子は売上ではなく利益、分母は投資額。数値は例。</desc><g font-family="Meiryo,Yu Gothic,sans-serif"><rect x="0" y="0" width="960" height="760" rx="0" fill="#f8fbfe" stroke="none"/><text x="36.00" y="25" font-size="18" fill="#61768a" font-weight="400" dominant-baseline="text-before-edge">問59  /  企業活動</text><text x="36.00" y="62" font-size="30" fill="#16324f" font-weight="700" dominant-baseline="text-before-edge">ROIの意味</text><line x1="36" y1="118" x2="924" y2="118" stroke="#bfd0df" stroke-width="1"/><rect x="65" y="170" width="330" height="120" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="185.00" y="192.0" font-size="30" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">投資額</text><text x="183.50" y="240.0" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">1,000万円</text><rect x="565" y="170" width="330" height="120" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="640.00" y="192.0" font-size="30" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">得られた利益</text><text x="693.00" y="240.0" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">200万円</text><text x="311.50" y="345" font-size="33" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">ROI ＝ 利益 ÷ 投資額</text><text x="272.50" y="410" font-size="30" fill="#16324f" font-weight="700" dominant-baseline="text-before-edge">200 ÷ 1,000 ＝ 0.2 ＝ 20％</text><rect x="90" y="520" width="230" height="43" rx="0" fill="#16324f" stroke="#bfd0df"/><text x="186.00" y="528.5" font-size="19" fill="white" font-weight="700" dominant-baseline="text-before-edge">指標</text><rect x="320" y="520" width="550" height="43" rx="0" fill="#16324f" stroke="#bfd0df"/><text x="547.50" y="528.5" font-size="19" fill="white" font-weight="700" dominant-baseline="text-before-edge">求めるもの</text><rect x="90" y="563" width="230" height="43" rx="0" fill="white" stroke="#bfd0df"/><text x="159.50" y="571.5" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">NPV・IRR</text><rect x="320" y="563" width="550" height="43" rx="0" fill="white" stroke="#bfd0df"/><text x="443.00" y="571.5" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">現在価値・それをゼロにする割引率</text><rect x="90" y="606" width="230" height="43" rx="0" fill="white" stroke="#bfd0df"/><text x="167.00" y="614.5" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">回収期間</text><rect x="320" y="606" width="550" height="43" rx="0" fill="white" stroke="#bfd0df"/><text x="462.00" y="614.5" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">元の投資を回収するまでの時間</text><rect x="36" y="675" width="888" height="62" rx="12" fill="#e4f5ed" stroke="none"/><text x="149.50" y="684" font-size="20" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">ROIは投資利益率。分子は売上ではなく利益、分母は投資額。数値は例。</text></g></svg>