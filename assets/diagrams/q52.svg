<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" role="img" aria-labelledby="title52 desc52"><title id="title52">問52 プロダクトイノベーション</title><desc id="desc52">新しい商品を開発する＝プロダクトイノベーション。工程の革新とは分ける。</desc><g font-family="Meiryo,Yu Gothic,sans-serif"><rect x="0" y="0" width="960" height="760" rx="0" fill="#f8fbfe" stroke="none"/><text x="36.00" y="25" font-size="18" fill="#61768a" font-weight="400" dominant-baseline="text-before-edge">問52  /  技術経営</text><text x="36.00" y="62" font-size="30" fill="#16324f" font-weight="700" dominant-baseline="text-before-edge">プロダクトイノベーション</text><line x1="36" y1="118" x2="924" y2="118" stroke="#bfd0df" stroke-width="1"/><rect x="60" y="185" width="370" height="185" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="170.00" y="225.5" font-size="30" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">プロダクト</text><text x="150.00" y="273.5" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">何を提供するかを革新</text><text x="140.50" y="301.5" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">新商品・差別化した商品</text><rect x="530" y="185" width="370" height="185" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="655.00" y="225.5" font-size="30" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">プロセス</text><text x="639.00" y="273.5" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">どう作るかを革新</text><text x="629.50" y="301.5" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">生産方法・業務手順</text><rect x="110" y="475" width="270" height="120" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="157.50" y="499.5" font-size="25" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">製品・サービス</text><text x="169.00" y="542.5" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">新しい価値を作る</text><rect x="580" y="475" width="270" height="120" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="652.50" y="499.5" font-size="25" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">工程・手順</text><text x="648.50" y="542.5" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">作り方を変える</text><rect x="36" y="675" width="888" height="62" rx="12" fill="#e4f5ed" stroke="none"/><text x="130.00" y="684" font-size="20" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">新しい商品を開発する＝プロダクトイノベーション。工程の革新とは分ける。</text><text x="924" y="25" font-size="16" fill="#61768a" text-anchor="end" dominant-baseline="text-before-edge">概念の整理</text></g></svg>