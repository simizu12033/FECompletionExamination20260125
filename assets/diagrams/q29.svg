<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" role="img" aria-labelledby="title29 desc29"><title id="title29">問29 2要素認証</title><desc id="desc29">手段が二つでも、要素が同じなら2要素認証とはいわない。</desc><g font-family="Meiryo,Yu Gothic,sans-serif"><rect x="0" y="0" width="960" height="760" rx="0" fill="#f8fbfe" stroke="none"/><text x="36.00" y="25" font-size="18" fill="#61768a" font-weight="400" dominant-baseline="text-before-edge">問29  /  セキュリティ</text><text x="36.00" y="62" font-size="30" fill="#16324f" font-weight="700" dominant-baseline="text-before-edge">2要素認証</text><line x1="36" y1="118" x2="924" y2="118" stroke="#bfd0df" stroke-width="1"/><rect x="60" y="160" width="360" height="75" rx="0" fill="#16324f" stroke="#bfd0df"/><text x="198.00" y="183.5" font-size="21" fill="white" font-weight="700" dominant-baseline="text-before-edge">認証要素</text><rect x="420" y="160" width="480" height="75" rx="0" fill="#16324f" stroke="#bfd0df"/><text x="649.50" y="183.5" font-size="21" fill="white" font-weight="700" dominant-baseline="text-before-edge">例</text><rect x="60" y="235" width="360" height="75" rx="0" fill="white" stroke="#bfd0df"/><text x="156.00" y="258.5" font-size="21" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">知識：知っている</text><rect x="420" y="235" width="480" height="75" rx="0" fill="white" stroke="#bfd0df"/><text x="544.50" y="258.5" font-size="21" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">パスワード・秘密の質問</text><rect x="60" y="310" width="360" height="75" rx="0" fill="white" stroke="#bfd0df"/><text x="156.00" y="333.5" font-size="21" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">所持：持っている</text><rect x="420" y="310" width="480" height="75" rx="0" fill="white" stroke="#bfd0df"/><text x="513.00" y="333.5" font-size="21" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">トークン・クライアント証明書</text><rect x="60" y="385" width="360" height="75" rx="0" fill="white" stroke="#bfd0df"/><text x="156.00" y="408.5" font-size="21" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">生体：身体の特徴</text><rect x="420" y="385" width="480" height="75" rx="0" fill="white" stroke="#bfd0df"/><text x="607.50" y="408.5" font-size="21" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">指紋・静脈</text><rect x="75" y="525" width="360" height="110" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="147.00" y="544.5" font-size="25" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">パスワード ＋ 静脈</text><text x="138.50" y="587.5" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">知識 ＋ 生体 → 異なる要素</text><rect x="525" y="525" width="360" height="110" rx="12" fill="#fff0ed" stroke="#bfd0df"/><text x="634.50" y="544.5" font-size="25" fill="#b34b52" font-weight="700" dominant-baseline="text-before-edge">指紋 ＋ 静脈</text><text x="598.00" y="587.5" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">生体 ＋ 生体 → 同じ要素</text><rect x="36" y="675" width="888" height="62" rx="12" fill="#e4f5ed" stroke="none"/><text x="213.00" y="684" font-size="20" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">手段が二つでも、要素が同じなら2要素認証とはいわない。</text><text x="924" y="25" font-size="16" fill="#61768a" text-anchor="end" dominant-baseline="text-before-edge">問題に対応</text></g></svg>