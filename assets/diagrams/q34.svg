<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" role="img" aria-labelledby="title34 desc34"><title id="title34">問34 E-Rモデルのエンティティ</title><desc id="desc34">エンティティには属性がある。注文・契約など物理的でない概念も対象。</desc><g font-family="Meiryo,Yu Gothic,sans-serif"><rect x="0" y="0" width="960" height="760" rx="0" fill="#f8fbfe" stroke="none"/><text x="36.00" y="25" font-size="18" fill="#61768a" font-weight="400" dominant-baseline="text-before-edge">問34  /  システム開発</text><text x="36.00" y="62" font-size="30" fill="#16324f" font-weight="700" dominant-baseline="text-before-edge">E-Rモデルのエンティティ</text><line x1="36" y1="118" x2="924" y2="118" stroke="#bfd0df" stroke-width="1"/><rect x="60" y="180" width="340" height="130" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="117.50" y="209.5" font-size="25" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">エンティティ：生徒</text><text x="144.50" y="252.5" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">管理する対象の種類</text><rect x="545" y="165" width="350" height="155" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="695.00" y="193.0" font-size="25" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">属性</text><text x="634.50" y="236.0" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">生徒番号・氏名など</text><text x="644.00" y="264.0" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">対象の特性を表す</text><line x1="410" y1="250" x2="535" y2="250" stroke="#2872ae" stroke-width="3"/><polygon points="535.0,250.0 522.3,255.8 522.3,244.2" fill="#2872ae"/><rect x="448.5" y="217.0" width="48.0" height="27" rx="3" fill="#f8fbfe" stroke="none"/><text x="454.50" y="219.0" font-size="18" fill="#2872ae" font-weight="400" dominant-baseline="text-before-edge">持つ</text><rect x="100" y="450" width="380.0" height="64" rx="0" fill="#16324f" stroke="#bfd0df"/><text x="248.00" y="468.0" font-size="21" fill="white" font-weight="700" dominant-baseline="text-before-edge">生徒番号</text><rect x="480.0" y="450" width="380.0" height="64" rx="0" fill="#16324f" stroke="#bfd0df"/><text x="649.00" y="468.0" font-size="21" fill="white" font-weight="700" dominant-baseline="text-before-edge">氏名</text><rect x="100" y="514" width="380.0" height="64" rx="0" fill="white" stroke="#bfd0df"/><text x="270.50" y="532.0" font-size="21" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">001</text><rect x="480.0" y="514" width="380.0" height="64" rx="0" fill="white" stroke="#bfd0df"/><text x="649.00" y="532.0" font-size="21" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">佐藤</text><rect x="100" y="578" width="380.0" height="64" rx="0" fill="white" stroke="#bfd0df"/><text x="270.50" y="596.0" font-size="21" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">002</text><rect x="480.0" y="578" width="380.0" height="64" rx="0" fill="white" stroke="#bfd0df"/><text x="649.00" y="596.0" font-size="21" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">鈴木</text><text x="317.50" y="385" font-size="25" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">各行が具体例＝インスタンス</text><rect x="36" y="675" width="888" height="62" rx="12" fill="#e4f5ed" stroke="none"/><text x="150.00" y="684" font-size="20" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">エンティティには属性がある。注文・契約など物理的でない概念も対象。</text><text x="924" y="25" font-size="16" fill="#61768a" text-anchor="end" dominant-baseline="text-before-edge">説明用の例</text></g></svg>