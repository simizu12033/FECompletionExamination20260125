<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" role="img" aria-labelledby="title28 desc28"><title id="title28">問28 共通鍵の必要数</title><desc id="desc28">1ペアに共通鍵1個。人数から「2人の組合せ」を数える。</desc><g font-family="Meiryo,Yu Gothic,sans-serif"><rect x="0" y="0" width="960" height="760" rx="0" fill="#f8fbfe" stroke="none"/><text x="36.00" y="25" font-size="18" fill="#61768a" font-weight="400" dominant-baseline="text-before-edge">問28  /  セキュリティ</text><text x="36.00" y="62" font-size="30" fill="#16324f" font-weight="700" dominant-baseline="text-before-edge">共通鍵の必要数</text><line x1="36" y1="118" x2="924" y2="118" stroke="#bfd0df" stroke-width="1"/><line x1="160" y1="230" x2="400" y2="230" stroke="#2872ae" stroke-width="3"/><line x1="160" y1="230" x2="160" y2="470" stroke="#2872ae" stroke-width="3"/><line x1="160" y1="230" x2="400" y2="470" stroke="#2872ae" stroke-width="3"/><line x1="400" y1="230" x2="160" y2="470" stroke="#2872ae" stroke-width="3"/><line x1="400" y1="230" x2="400" y2="470" stroke="#2872ae" stroke-width="3"/><line x1="160" y1="470" x2="400" y2="470" stroke="#2872ae" stroke-width="3"/><circle cx="160" cy="230" r="33" fill="white" stroke="#2872ae" stroke-width="2"/><text x="149.50" y="209" font-size="28" fill="#16324f" font-weight="700" dominant-baseline="text-before-edge">A</text><circle cx="400" cy="230" r="33" fill="white" stroke="#2872ae" stroke-width="2"/><text x="390.00" y="209" font-size="28" fill="#16324f" font-weight="700" dominant-baseline="text-before-edge">B</text><circle cx="160" cy="470" r="33" fill="white" stroke="#2872ae" stroke-width="2"/><text x="150.50" y="449" font-size="28" fill="#16324f" font-weight="700" dominant-baseline="text-before-edge">C</text><circle cx="400" cy="470" r="33" fill="white" stroke="#2872ae" stroke-width="2"/><text x="389.00" y="449" font-size="28" fill="#16324f" font-weight="700" dominant-baseline="text-before-edge">D</text><text x="180.00" y="565" font-size="24" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">4人なら6組のペア</text><rect x="535" y="190" width="360" height="175" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="644.50" y="226.5" font-size="28" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">100人なら</text><text x="652.00" y="272.5" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">100 × 99 ÷ 2</text><text x="665.50" y="300.5" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">＝ 4,950個</text><rect x="535" y="435" width="360" height="155" rx="12" fill="#fff1c9" stroke="#bfd0df"/><text x="623.50" y="464.0" font-size="23" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">ABとBAは同じ鍵</text><text x="610.50" y="505.0" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">両方向を別々に数えると</text><text x="648.50" y="533.0" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">二重計上になる</text><rect x="36" y="675" width="888" height="62" rx="12" fill="#e4f5ed" stroke="none"/><text x="219.00" y="684" font-size="20" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">1ペアに共通鍵1個。人数から「2人の組合せ」を数える。</text><text x="924" y="25" font-size="16" fill="#61768a" text-anchor="end" dominant-baseline="text-before-edge">問題の数値＋例</text></g></svg>