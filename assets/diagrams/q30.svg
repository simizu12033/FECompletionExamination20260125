<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" role="img" aria-labelledby="title30 desc30"><title id="title30">問30 CSIRT構築支援資料</title><desc id="desc30">「組織的なインシデント対応体制を作る支援」が設問の目的。</desc><g font-family="Meiryo,Yu Gothic,sans-serif"><rect x="0" y="0" width="960" height="760" rx="0" fill="#f8fbfe" stroke="none"/><text x="36.00" y="25" font-size="18" fill="#61768a" font-weight="400" dominant-baseline="text-before-edge">問30  /  セキュリティ</text><text x="36.00" y="62" font-size="30" fill="#16324f" font-weight="700" dominant-baseline="text-before-edge">CSIRT構築支援資料</text><line x1="36" y1="118" x2="924" y2="118" stroke="#bfd0df" stroke-width="1"/><rect x="310" y="165" width="340" height="110" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="429.01" y="181.5" font-size="31" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">CSIRT</text><text x="375.50" y="230.5" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">インシデント対応チーム</text><rect x="60" y="360" width="230" height="115" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="151.00" y="382.5" font-size="24" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">受付</text><text x="118.00" y="424.5" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">報告を受ける</text><rect x="365" y="360" width="230" height="115" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="420.00" y="382.5" font-size="24" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">分析・判断</text><text x="423.00" y="424.5" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">状況を調べる</text><rect x="670" y="360" width="230" height="115" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="725.00" y="382.5" font-size="24" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">対応・調整</text><text x="690.00" y="424.5" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">関係者と復旧