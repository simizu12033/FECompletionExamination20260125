<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" role="img" aria-labelledby="title12 desc12"><title id="title12">問12 MTBF・MTTRと稼働率</title><desc id="desc12">MTBFは長いほどよく、MTTRは短いほどよい。分母には両方を足す。</desc><g font-family="Meiryo,Yu Gothic,sans-serif"><rect x="0" y="0" width="960" height="760" rx="0" fill="#f8fbfe" stroke="none"/><text x="36.00" y="25" font-size="18" fill="#61768a" font-weight="400" dominant-baseline="text-before-edge">問12  /  システム構成</text><text x="36.00" y="62" font-size="30" fill="#16324f" font-weight="700" dominant-baseline="text-before-edge">MTBF・MTTRと稼働率</text><line x1="36" y1="118" x2="924" y2="118" stroke="#bfd0df" stroke-width="1"/><rect x="60" y="160" width="150" height="73" rx="0" fill="#16324f" stroke="#bfd0df"/><text x="135.00" y="182.5" font-size="21" fill="white" font-weight="700" dominant-baseline="text-before-edge"></text><rect x="210" y="160" width="345" height="73" rx="0" fill="#16324f" stroke="#bfd0df"/><text x="289.00" y="182.5" font-size="21" fill="white" font-weight="700" dominant-baseline="text-before-edge">MTBF（動く時間）</text><rect x="555" y="160" width="345" height="73" rx="0" fill="#16324f" stroke="#bfd0df"/><text x="633.00" y="182.5" font-size="21" fill="white" font-weight="700" dominant-baseline="text-before-edge">MTTR（直す時間）</text><rect x="60" y="233" width="150" height="73" rx="0" fill="white" stroke="#bfd0df"/><text x="103.50" y="255.5" font-size="21" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">今年度</text><rect x="210" y="233" width="345" height="73" rx="0" fill="white" stroke="#bfd0df"/><text x="332.00" y="255.5" font-size="21" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">3,000時間</text><rect x="555" y="233" width="345" height="73" rx="0" fill="white" stroke="#bfd0df"/><text x="677.00" y="255.5" font-size="21" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">1,000時間</text><rect x="60" y="306" width="150" height="73" rx="0" fill="white" stroke="#bfd0df"/><text x="114.00" y="328.5" font-size="21" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">改善</text><rect x="210" y="306" width="345" height="73" rx="0" fill="white" stroke="#bfd0df"/><text x="302.50" y="328.5" font-size="21" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">×1.2（20％増）</text><rect x="555" y="306" width="345" height="73" rx="0" fill="white" stroke="#bfd0df"/><text x="647.50" y="328.5" font-size="21" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">×0.9（10％減）</text><rect x="60" y="379" width="150" height="73" rx="0" fill="#e4f5ed" stroke="#bfd0df"/><text x="103.50" y="401.5" font-size="21" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">翌年度</text><rect x="210" y="379" width="345" height="73" rx="0" fill="#e4f5ed" stroke="#bfd0df"/><text x="332.00" y="401.5" font-size="21" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">3,600時間</text><rect x="555" y="379" width="345" height="73" rx="0" fill="#e4f5ed" stroke="#bfd0df"/><text x="687.00" y="401.5" font-size="21" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">900時間</text><rect x="80" y="495" width="640" height="65" rx="0" fill="#087d64" stroke="none"/><rect x="720" y="495" width="160" height="65" rx="0" fill="#b34b52" stroke="none"/><text x="312.00" y="513" font-size="24" fill="white" font-weight="700" dominant-baseline="text-before-edge">稼働 3,600時間</text><text x="762.00" y="514" font-size="20" fill="white" font-weight="400" dominant-baseline="text-before-edge">修理900</text><text x="240.50" y="600" font-size="29" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">3,600 ÷ (3,600 ＋ 900) ＝ 80％</text><rect x="36" y="675" width="888" height="62" rx="12" fill="#e4f5ed" stroke="none"/><text x="161.50" y="684" font-size="20" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">MTBFは長いほどよく、MTTRは短いほどよい。分母には両方を足す。</text></g></svg>