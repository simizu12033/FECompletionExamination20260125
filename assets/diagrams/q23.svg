<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" role="img" aria-labelledby="title23 desc23"><title id="title23">問23 名前からIPアドレスを解決する仕組み</title><desc id="desc23">通信相手のIPアドレスを「名前から問い合わせる」ならDNS。</desc><g font-family="Meiryo,Yu Gothic,sans-serif"><rect x="0" y="0" width="960" height="760" rx="0" fill="#f8fbfe" stroke="none"/><text x="36.00" y="25" font-size="18" fill="#61768a" font-weight="400" dominant-baseline="text-before-edge">問23  /  ネットワーク</text><text x="36.00" y="62" font-size="30" fill="#16324f" font-weight="700" dominant-baseline="text-before-edge">名前からIPアドレスを解決する仕組み</text><line x1="36" y1="118" x2="924" y2="118" stroke="#bfd0df" stroke-width="1"/><rect x="50" y="210" width="230" height="120" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="143.00" y="236.0" font-size="22" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">端末</text><text x="89.00" y="276.0" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">相手の名前を指定</text><rect x="365" y="210" width="230" height="120" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="455.00" y="236.0" font-size="22" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">DNS</text><text x="413.50" y="276.0" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">名前とIPの対応</text><rect x="680" y="210" width="230" height="120" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="751.00" y="236.0" font-size="22" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">通信相手</text><text x="728.50" y="276.0" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">宛先のIPが判明</text><line x1="288" y1="250" x2="355" y2="250" stroke="#2872ae" stroke-width="3"/><polygon points="355.0,250.0 342.3,255.8 342.3,244.2" fill="#2872ae"/><rect x="285.5" y="217.0" width="72.0" height="27" rx="3" fill="#f8fbfe" stroke="none"/><text x="291.50" y="219.0" font-size="18" fill="#2872ae" font-weight="400" dominant-baseline="text-before-edge">① 照会</text><line x1="365" y1="350" x2="280" y2="350" stroke="#2872ae" stroke-width="3"/><polygon points="280.0,350.0 292.7,344.2 292.7,355.8" fill="#2872ae"/><rect x="280.5" y="358.0" width="84.0" height="27" rx="3" fill="#f8fbfe" stroke="none"/><text x="286.50" y="360.0" font-size="18" fill="#2872ae" font-weight="400" dominant-baseline="text-before-edge">IPを回答</text><line x1="160" y1="210" x2="160" y2="165" stroke="#2872ae" stroke-width="2"/><line x1="160" y1="165" x2="795" y2="165" stroke="#2872ae" stroke-width="2"/><line x1="795" y1="165" x2="795" y2="200" stroke="#2872ae" stroke-width="3"/><polygon points="795.0,200.0 789.2,187.3 800.8,187.3" fill="#2872ae"/><text x="288.00" y="131" font-size="18" fill="#2872ae" font-weight="400" dominant-baseline="text-before-edge">② 得たIPアドレスを宛先にして、端末から通信</text><rect x="80" y="455" width="170" height="48" rx="0" fill="#16324f" stroke="#bfd0df"/><text x="135.00" y="465.5" font-size="20" fill="white" font-weight="700" dominant-baseline="text-before-edge">仕組み</text><rect x="250" y="455" width="630" height="48" rx="0" fill="#16324f" stroke="#bfd0df"/><text x="505.00" y="465.5" font-size="20" fill="white" font-weight="700" dominant-baseline="text-before-edge">解決すること</text><rect x="80" y="503" width="170" height="48" rx="0" fill="white" stroke="#bfd0df"/><text x="143.50" y="513.5" font-size="20" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">DNS</text><rect x="250" y="503" width="630" height="48" rx="0" fill="white" stroke="#bfd0df"/><text x="478.00" y="513.5" font-size="20" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">名前 → IPアドレス</text><rect x="80" y="551" width="170" height="48" rx="0" fill="white" stroke="#bfd0df"/><text x="145.00" y="561.5" font-size="20" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">ARP</text><rect x="250" y="551" width="630" height="48" rx="0" fill="white" stroke="#bfd0df"/><text x="436.00" y="561.5" font-size="20" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">IPアドレス → MACアドレス</text><rect x="80" y="599" width="170" height="48" rx="0" fill="white" stroke="#bfd0df"/><text x="137.50" y="609.5" font-size="20" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">DHCP</text><rect x="250" y="599" width="630" height="48" rx="0" fill="white" stroke="#bfd0df"/><text x="455.00" y="609.5" font-size="20" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">自分のIP設定を自動取得</text><rect x="36" y="675" width="888" height="62" rx="12" fill="#e4f5ed" stroke="none"/><text x="195.50" y="684" font-size="20" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">通信相手のIPアドレスを「名前から問い合わせる」ならDNS。</text></g></svg>