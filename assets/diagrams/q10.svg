<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" role="img" aria-labelledby="title10 desc10"><title id="title10">問10 磁気ディスクのアクセス時間</title><desc id="desc10">位置決めを短くする／回転を速くして待ちを減らすと、アクセスが速くなる。</desc><g font-family="Meiryo,Yu Gothic,sans-serif"><rect x="0" y="0" width="960" height="760" rx="0" fill="#f8fbfe" stroke="none"/><text x="36.00" y="25" font-size="18" fill="#61768a" font-weight="400" dominant-baseline="text-before-edge">問10  /  ハードウェア</text><text x="36.00" y="62" font-size="30" fill="#16324f" font-weight="700" dominant-baseline="text-before-edge">磁気ディスクのアクセス時間</text><line x1="36" y1="118" x2="924" y2="118" stroke="#bfd0df" stroke-width="1"/><circle cx="240" cy="350" r="145" fill="#edf3f9" stroke="#2872ae" stroke-width="2"/><circle cx="240" cy="350" r="115" fill="#edf3f9" stroke="#2872ae" stroke-width="2"/><circle cx="240" cy="350" r="85" fill="#edf3f9" stroke="#2872ae" stroke-width="2"/><circle cx="240" cy="350" r="55" fill="#edf3f9" stroke="#2872ae" stroke-width="2"/><circle cx="240" cy="350" r="18" fill="white" stroke="#2872ae" stroke-width="2"/><line x1="440" y1="185" x2="284" y2="290" stroke="#b34b52" stroke-width="12"/><circle cx="283" cy="290" r="11" fill="#fff1c9" stroke="#b34b52" stroke-width="2"/><text x="90.00" y="535" font-size="20" fill="#61768a" font-weight="400" dominant-baseline="text-before-edge">磁気ディスクとヘッド（模式図）</text><rect x="500" y="170" width="410" height="105" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="646.50" y="188.5" font-size="22" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">① 位置決め</text><text x="610.00" y="228.5" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">目的のトラックへ移動</text><rect x="500" y="310" width="410" height="105" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="646.50" y="328.5" font-size="22" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">② 回転待ち</text><text x="591.00" y="368.5" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">目的データが来るまで待つ</text><rect x="500" y="450" width="410" height="105" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="668.50" y="468.5" font-size="22" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">③ 転送</text><text x="610.00" y="508.5" font-size="19" fill="#16324f" font-weight="400" dominant-baseline="text-before-edge">データを読み書きする</text><text x="218.50" y="610" font-size="25" fill="#16324f" font-weight="700" dominant-baseline="text-before-edge">アクセス時間 ＝ 位置決め ＋ 回転待ち ＋ 転送</text><rect x="36" y="675" width="888" height="62" rx="12" fill="#e4f5ed" stroke="none"/><text x="130.00" y="684" font-size="20" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">位置決めを短くする／回転を速くして待ちを減らすと、アクセスが速くなる。</text><text x="924" y="25" font-size="16" fill="#61768a" text-anchor="end" dominant-baseline="text-before-edge">概念の整理</text></g></svg>