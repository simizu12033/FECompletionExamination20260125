<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" role="img" aria-labelledby="title2 desc2"><title id="title2">問2 空白を含む文字列の数</title><desc id="desc2">数字が続く長さは3・2・1文字の3通り。重ならない場合を足す。</desc><g font-family="Meiryo,Yu Gothic,sans-serif"><rect x="0" y="0" width="960" height="760" rx="0" fill="#f8fbfe" stroke="none"/><text x="36.00" y="25" font-size="18" fill="#61768a" font-weight="400" dominant-baseline="text-before-edge">問02  /  基礎理論</text><text x="36.00" y="62" font-size="30" fill="#16324f" font-weight="700" dominant-baseline="text-before-edge">空白を含む文字列の数</text><line x1="36" y1="118" x2="924" y2="118" stroke="#bfd0df" stroke-width="1"/><text x="296.00" y="147" font-size="23" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">空白に進んだら、数字へは戻れない</text><rect x="60" y="210" width="106" height="76" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="91.00" y="233.0" font-size="22" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">数字</text><rect x="182" y="210" width="106" height="76" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="213.00" y="233.0" font-size="22" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">数字</text><rect x="304" y="210" width="106" height="76" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="335.00" y="233.0" font-size="22" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">数字</text><text x="480.00" y="230" font-size="25" fill="#16324f" font-weight="700" dominant-baseline="text-before-edge">10 × 10 × 10 ＝ 1,000</text><rect x="60" y="325" width="106" height="76" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="91.00" y="348.0" font-size="22" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">数字</text><rect x="182" y="325" width="106" height="76" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="213.00" y="348.0" font-size="22" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">数字</text><rect x="304" y="325" width="106" height="76" rx="12" fill="#fff1c9" stroke="#bfd0df"/><text x="335.00" y="348.0" font-size="22" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">空白</text><text x="480.00" y="345" font-size="25" fill="#16324f" font-weight="700" dominant-baseline="text-before-edge">10 × 10 × 1 ＝ 100</text><rect x="60" y="440" width="106" height="76" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="91.00" y="463.0" font-size="22" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">数字</text><rect x="182" y="440" width="106" height="76" rx="12" fill="#fff1c9" stroke="#bfd0df"/><text x="213.00" y="463.0" font-size="22" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">空白</text><rect x="304" y="440" width="106" height="76" rx="12" fill="#fff1c9" stroke="#bfd0df"/><text x="335.00" y="463.0" font-size="22" fill="#2872ae" font-weight="700" dominant-baseline="text-before-edge">空白</text><text x="480.00" y="460" font-size="25" fill="#16324f" font-weight="700" dominant-baseline="text-before-edge">10 × 1 × 1 ＝ 10</text><text x="237.50" y="585" font-size="29" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">1,000 ＋ 100 ＋ 10 ＝ 1,110通り</text><rect x="36" y="675" width="888" height="62" rx="12" fill="#e4f5ed" stroke="none"/><text x="182.00" y="684" font-size="20" fill="#087d64" font-weight="700" dominant-baseline="text-before-edge">数字が続く長さは3・2・1文字の3通り。重ならない場合を足す。</text><text x="924" y="25" font-size="16" fill="#61768a" text-anchor="end" dominant-baseline="text-before-edge">問題に対応</text></g></svg>